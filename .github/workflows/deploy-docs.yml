name: Deploy Admin Panel Docs

on:
  push:
    branches: [ main, master, userdocs ]
    paths: [ 'docs/admin-panel/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare content for Documentation Theme
        run: |
          # Create site directory
          mkdir -p _site_source
          
          # Copy admin-panel content
          cp -r docs/admin-panel/* _site_source/
          
          # Rename all README.md files to index.md
          find _site_source -name "README.md" -exec sh -c '
            dir=$(dirname "$1")
            mv "$1" "$dir/index.md"
            echo "Renamed $1 to $dir/index.md"
          ' _ {} \;
          
          # Fix GitBook syntax
          find _site_source -name "*.md" -type f -exec sed -i 's/{% hint style="[^"]*" %}/> **Note:** /g' {} \;
          find _site_source -name "*.md" -type f -exec sed -i 's/{% endhint %}/\n/g' {} \;
          find _site_source -name "*.md" -type f -exec sed -i 's/{% hint %}/> **Note:** /g' {} \;

      - name: Add Documentation Theme front matter
        run: |
          # Root index page
          if [ -f _site_source/index.md ]; then
            cat > temp_index.md << 'EOF'
          ---
          title: "Admin Panel Documentation"
          keywords: homepage
          sidebar: mydoc_sidebar
          permalink: index.html
          summary: Navixy Admin Panel Administration Guide
          ---
          
          EOF
            tail -n +1 _site_source/index.md >> temp_index.md
            mv temp_index.md _site_source/index.md
          fi
          
          # Access page
          if [ -f _site_source/access.md ]; then
            cat > temp_access.md << 'EOF'
          ---
          title: Access
          sidebar: mydoc_sidebar
          permalink: access.html
          folder: mydoc
          ---
          
          EOF
            tail -n +1 _site_source/access.md >> temp_access.md
            mv temp_access.md _site_source/access.md
          fi
          
          # Users section
          if [ -f _site_source/users/index.md ]; then
            cat > temp_users.md << 'EOF'
          ---
          title: Users
          sidebar: mydoc_sidebar
          permalink: users.html
          folder: mydoc
          ---
          
          EOF
            tail -n +1 _site_source/users/index.md >> temp_users.md
            mv temp_users.md _site_source/users/index.md
          fi
          
          # Users children
          for file in _site_source/users/*.md; do
            if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              filename=$(basename "$file" .md)
              cat > temp_file.md << EOF
          ---
          title: $title
          sidebar: mydoc_sidebar
          permalink: users_${filename}.html
          folder: mydoc
          ---
          
          EOF
              tail -n +1 "$file" >> temp_file.md
              mv temp_file.md "$file"
            fi
          done
          
          # Devices section
          if [ -f _site_source/devices/index.md ]; then
            cat > temp_devices.md << 'EOF'
          ---
          title: Devices
          sidebar: mydoc_sidebar
          permalink: devices.html
          folder: mydoc
          ---
          
          EOF
            tail -n +1 _site_source/devices/index.md >> temp_devices.md
            mv temp_devices.md _site_source/devices/index.md
          fi
          
          # Devices children
          for file in _site_source/devices/*.md; do
            if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              filename=$(basename "$file" .md)
              cat > temp_file.md << EOF
          ---
          title: $title
          sidebar: mydoc_sidebar
          permalink: devices_${filename}.html
          folder: mydoc
          ---
          
          EOF
              tail -n +1 "$file" >> temp_file.md
              mv temp_file.md "$file"
            fi
          done
          
          # Settings section
          if [ -f _site_source/settings/index.md ]; then
            cat > temp_settings.md << 'EOF'
          ---
          title: Settings
          sidebar: mydoc_sidebar
          permalink: settings.html
          folder: mydoc
          ---
          
          EOF
            tail -n +1 _site_source/settings/index.md >> temp_settings.md
            mv temp_settings.md _site_source/settings/index.md
          fi
          
          # Settings children
          for file in _site_source/settings/*.md; do
            if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              filename=$(basename "$file" .md)
              cat > temp_file.md << EOF
          ---
          title: $title
          sidebar: mydoc_sidebar
          permalink: settings_${filename}.html
          folder: mydoc
          ---
          
          EOF
              tail -n +1 "$file" >> temp_file.md
              mv temp_file.md "$file"
            fi
          done
          
          # Settings subdirectories
          for subdir in _site_source/settings/*/; do
            if [ -d "$subdir" ]; then
              subdir_name=$(basename "$subdir")
              subdir_title=$(echo "$subdir_name" | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              
              # Subdir index
              if [ -f "$subdir/index.md" ]; then
                cat > temp_subdir.md << EOF
          ---
          title: $subdir_title
          sidebar: mydoc_sidebar
          permalink: settings_${subdir_name}.html
          folder: mydoc
          ---
          
          EOF
                tail -n +1 "$subdir/index.md" >> temp_subdir.md
                mv temp_subdir.md "$subdir/index.md"
              fi
              
              # Subdir children
              for file in "$subdir"*.md; do
                if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
                  title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
                  filename=$(basename "$file" .md)
                  cat > temp_file.md << EOF
          ---
          title: $title
          sidebar: mydoc_sidebar
          permalink: settings_${subdir_name}_${filename}.html
          folder: mydoc
          ---
          
          EOF
                  tail -n +1 "$file" >> temp_file.md
                  mv temp_file.md "$file"
                fi
              done
            fi
          done
          
          # Plans section
          if [ -f _site_source/plans/index.md ]; then
            cat > temp_plans.md << 'EOF'
          ---
          title: Plans
          sidebar: mydoc_sidebar
          permalink: plans.html
          folder: mydoc
          ---
          
          EOF
            tail -n +1 _site_source/plans/index.md >> temp_plans.md
            mv temp_plans.md _site_source/plans/index.md
          fi
          
          # Plans children
          for file in _site_source/plans/*.md; do
            if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              filename=$(basename "$file" .md)
              cat > temp_file.md << EOF
          ---
          title: $title
          sidebar: mydoc_sidebar
          permalink: plans_${filename}.html
          folder: mydoc
          ---
          
          EOF
              tail -n +1 "$file" >> temp_file.md
              mv temp_file.md "$file"
            fi
          done
          
          # Reports and Resellers
          if [ -f _site_source/reports.md ]; then
            cat > temp_reports.md << 'EOF'
          ---
          title: Reports
          sidebar: mydoc_sidebar
          permalink: reports.html
          folder: mydoc
          ---
          
          EOF
            tail -n +1 _site_source/reports.md >> temp_reports.md
            mv temp_reports.md _site_source/reports.md
          fi
          
          if [ -f _site_source/resellers.md ]; then
            cat > temp_resellers.md << 'EOF'
          ---
          title: Resellers
          sidebar: mydoc_sidebar
          permalink: resellers.html
          folder: mydoc
          ---
          
          EOF
            tail -n +1 _site_source/resellers.md >> temp_resellers.md
            mv temp_resellers.md _site_source/resellers.md
          fi

      - name: Create sidebar navigation
        run: |
          mkdir -p _site_source/_data/sidebars
          cat > _site_source/_data/sidebars/mydoc_sidebar.yml << 'EOF'
          entries:
          - title: sidebar
            product: Admin Panel Documentation
            version: 1.0
            folders:
          
            - title: Getting Started
              output: web, pdf
              folderitems:
              - title: Home
                url: /index.html
                output: web, pdf
                type: homepage
              - title: Access
                url: /access.html
                output: web, pdf
          
            - title: Users
              output: web, pdf
              folderitems:
              - title: Users Overview
                url: /users.html
                output: web, pdf
          EOF
          
          # Add Users children dynamically
          for file in _site_source/users/*.md; do
            if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              filename=$(basename "$file" .md)
              cat >> _site_source/_data/sidebars/mydoc_sidebar.yml << EOF
              - title: $title
                url: /users_${filename}.html
                output: web, pdf
          EOF
            fi
          done
          
          cat >> _site_source/_data/sidebars/mydoc_sidebar.yml << 'EOF'
          
            - title: Devices
              output: web, pdf
              folderitems:
              - title: Devices Overview
                url: /devices.html
                output: web, pdf
          EOF
          
          # Add Devices children dynamically
          for file in _site_source/devices/*.md; do
            if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              filename=$(basename "$file" .md)
              cat >> _site_source/_data/sidebars/mydoc_sidebar.yml << EOF
              - title: $title
                url: /devices_${filename}.html
                output: web, pdf
          EOF
            fi
          done
          
          cat >> _site_source/_data/sidebars/mydoc_sidebar.yml << 'EOF'
          
            - title: Settings
              output: web, pdf
              folderitems:
              - title: Settings Overview
                url: /settings.html
                output: web, pdf
          EOF
          
          # Add Settings children dynamically
          for file in _site_source/settings/*.md; do
            if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              filename=$(basename "$file" .md)
              cat >> _site_source/_data/sidebars/mydoc_sidebar.yml << EOF
              - title: $title
                url: /settings_${filename}.html
                output: web, pdf
          EOF
            fi
          done
          
          # Add Settings subdirectories
          for subdir in _site_source/settings/*/; do
            if [ -d "$subdir" ]; then
              subdir_name=$(basename "$subdir")
              subdir_title=$(echo "$subdir_name" | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              cat >> _site_source/_data/sidebars/mydoc_sidebar.yml << EOF
              - title: $subdir_title
                url: /settings_${subdir_name}.html
                output: web, pdf
          EOF
              
              # Add subdir children
              for file in "$subdir"*.md; do
                if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
                  title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
                  filename=$(basename "$file" .md)
                  cat >> _site_source/_data/sidebars/mydoc_sidebar.yml << EOF
                - title: $title
                  url: /settings_${subdir_name}_${filename}.html
                  output: web, pdf
          EOF
                fi
              done
            fi
          done
          
          cat >> _site_source/_data/sidebars/mydoc_sidebar.yml << 'EOF'
          
            - title: Plans
              output: web, pdf
              folderitems:
              - title: Plans Overview
                url: /plans.html
                output: web, pdf
          EOF
          
          # Add Plans children dynamically
          for file in _site_source/plans/*.md; do
            if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              filename=$(basename "$file" .md)
              cat >> _site_source/_data/sidebars/mydoc_sidebar.yml << EOF
              - title: $title
                url: /plans_${filename}.html
                output: web, pdf
          EOF
            fi
          done
          
          cat >> _site_source/_data/sidebars/mydoc_sidebar.yml << 'EOF'
          
            - title: Other
              output: web, pdf
              folderitems:
              - title: Reports
                url: /reports.html
                output: web, pdf
              - title: Resellers
                url: /resellers.html
                output: web, pdf
          EOF

      - name: Create Jekyll configuration
        run: |
          cat > _site_source/_config.yml << 'EOF'
          repository: amasyunin/udoc
          
          output: web
          # this property is useful for conditional filtering of content that is separate from the PDF.
          
          topnav_title: Admin Panel Documentation
          # this appears on the top navigation bar next to the home button
          
          site_title: Admin Panel Documentation
          # this appears in the html browser tab for the site title (seen mostly by search engines, not users)
          
          company_name: Navixy
          # this appears in the footer
          
          github_editme_path: # DISABLED - no edit buttons
          # if you're using Github, provide the basepath to the branch you've created for reviews, following the sample here. if not, leave this value blank.
          
          # gitlab_editme_path: tomjoht/documentation-theme-jekyll/blob/gh-pages/
          # if you're using GitLab, provide the basepath to the branch you've created for reviews, following the sample here. if not, leave this value blank.
          
          google_analytics: # DISABLED
          # if you have google-analytics ID, put it in. if not, edit this value to blank.
          
          host: 127.0.0.1
          # the preview server used. Leave as is.
          
          port: 4000
          # the port where the preview is rendered. You can leave this as is unless you have other Jekyll builds using this same port that might cause conflicts. in that case, use another port such as 4006.
          
          exclude:
            - .idea/
            - .gitignore
            - vendor
            - SUMMARY.md
          # these are the files and directories that jekyll will exclude from the build
          
          feedback_subject_line: Admin Panel Documentation
          
          feedback_email: # DISABLED
          # used as a contact email for the Feedback link in the top navigation bar
          
          feedback_disable: true
          # if you uncomment the previous line, the Feedback link gets removed
          
          feedback_text: # DISABLED
          # if you uncomment the previous line, it changes the Feedback text
          
          feedback_link: # DISABLED
          # if you uncomment the previous line, it changes where the feedback link points to
          
          highlighter: rouge
          # library used for syntax highlighting
          
          markdown: kramdown
          kramdown:
           input: GFM
           auto_ids: true
           hard_wrap: false
           syntax_highlighter: rouge
          
          # filter used to process markdown. note that kramdown differs from github-flavored markdown in some subtle ways
          
          collections:
            tooltips:
              output: false
          # collections are declared here. this renders the content in _tooltips and processes it, but doesn't output it as actual files in the output unless you change output to true
          
          defaults:
            -
              scope:
                path: ""
                type: "pages"
              values:
                layout: "page"
                comments: true
                # if you don't want to use Commento.io and just hide comments, change true to false wherever you see comments properties
                search: true
                sidebar: home_sidebar
                topnav: topnav
            -
              scope:
                path: ""
                type: "tooltips"
              values:
                layout: "page"
                search: true
                tooltip: true
          
            -
              scope:
                path: ""
                type: "posts"
              values:
                layout: "post"
                comments: true
                # if you don't want to use Commento.io and just hide comments, change true to false wherever you see comments properties
                search: true
                sidebar: home_sidebar
                topnav: topnav
          
          # these are defaults used for the frontmatter for these file types
          
          sidebars:
          - home_sidebar
          - mydoc_sidebar
          - product1_sidebar
          - product2_sidebar
          - other
          
          description: "Navixy Admin Panel Administration Guide"
          # the description is used in the feed.xml file
          
          # needed for sitemap.xml file only
          # url: http://idratherbewriting.com
          # baseurl: /documentation-theme-jekyll
          
          
          github: [metadata]
          
          url: "https://amasyunin.github.io"
          baseurl: "/udoc"
          
          remote_theme: tomjoht/documentation-theme-jekyll
          
          plugins:
            - jekyll-sitemap
            - jekyll-seo-tag
          EOF

      - name: Create custom CSS to remove header/footer
        run: |
          mkdir -p _site_source/css
          cat > _site_source/css/customstyles.css << 'EOF'
          /* Remove header completely */
          .navbar,
          .navbar-default,
          #mysidebar .nav > li.active > a {
              display: none !important;
          }
          
          /* Remove footer completely */
          .footer,
          footer,
          .site-footer {
              display: none !important;
          }
          
          /* Adjust main content to account for removed header */
          .col-md-9 {
              margin-top: 0 !important;
              padding-top: 20px;
          }
          
          /* Make sidebar full height */
          #mysidebar {
              position: fixed;
              top: 0;
              left: 0;
              height: 100vh;
              width: 300px;
              overflow-y: auto;
              background-color: #f7f7f9;
              border-right: 1px solid #e7e7e7;
              z-index: 1000;
          }
          
          /* Adjust main content positioning */
          .col-md-9 {
              margin-left: 320px;
              width: calc(100% - 320px);
          }
          
          /* Remove breadcrumbs */
          .breadcrumb {
              display: none !important;
          }
          
          /* Style sidebar navigation */
          #mysidebar .nav > li > a {
              font-weight: normal;
              color: #333;
              padding: 8px 15px;
          }
          
          #mysidebar .nav > li > a:hover {
              background-color: #e7e7e7;
          }
          
          /* Hide edit buttons */
          .btn-default,
          .improve_button {
              display: none !important;
          }
          
          /* Remove any remaining branding */
          .company_name,
          .copyright {
              display: none !important;
          }
          
          body {
              margin: 0;
              padding: 0;
          }
          EOF

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_source
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
