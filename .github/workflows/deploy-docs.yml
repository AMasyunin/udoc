- name: Create Jekyll configuration
  run: |
    cat > _site_source/_config.yml << 'EOF'
    title: "Admin Panel Documentation"
    description: "Navixy Admin Panel Administration Guide"
    baseurl: "/udoc"
    url: "https://amasyunin.github.io"
    
    remote_theme: just-the-docs/just-the-docs
    
    # Just the Docs theme configuration
    color_scheme: nil
    
    # Search enabled
    search_enabled: true
    
    # Navigation configuration
    nav_sort: case_insensitive
    
    # Back to top link
    back_to_top: true
    back_to_top_text: "Back to top"
    
    # REMOVE BRANDING - Key additions:
    # Remove default aux links (GitHub link)
    aux_links: {}
    
    # Remove edit page links
    gh_edit_link: false
    gh_edit_link_text: ""
    gh_edit_repository: ""
    
    # Custom footer (removes "Just the Docs" attribution)
    footer_content: "© 2025 Navixy. All rights reserved."
    
    # Optional: Add your own navigation links
    # nav_external_links:
    #   - title: "Navixy Website"
    #     url: "https://navixy.com"
    #     hide_icon: true
    
    markdown: kramdown
    highlighter: rouge
    
    kramdown:
      syntax_highlighter_opts:
        block:
          line_numbers: false
    
    exclude:
      - SUMMARY.md
      - Gemfile
      - Gemfile.lock
      - node_modules/
      - vendor/
    
    plugins:
      - jekyll-seo-tag
    EOF
