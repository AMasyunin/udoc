name: Deploy Admin Panel Docs

on:
  push:
    branches: [ main, master, userdocs ]
    paths: [ 'docs/admin-panel/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare content for Docsy
        run: |
          # Create site directory
          mkdir -p _site_source
          
          # Copy admin-panel content
          cp -r docs/admin-panel/* _site_source/
          
          # Rename all README.md files to index.md (keep standard Jekyll convention)
          find _site_source -name "README.md" -exec sh -c '
            dir=$(dirname "$1")
            mv "$1" "$dir/index.md"
            echo "Renamed $1 to $dir/index.md"
          ' _ {} \;
          
          # Fix GitBook syntax
          find _site_source -name "*.md" -type f -exec sed -i 's/{% hint style="[^"]*" %}/> **Note:** /g' {} \;
          find _site_source -name "*.md" -type f -exec sed -i 's/{% endhint %}/\n/g' {} \;
          find _site_source -name "*.md" -type f -exec sed -i 's/{% hint %}/> **Note:** /g' {} \;

      - name: Add Docsy front matter
        run: |
          # Root index page
          if [ -f _site_source/_index.md ]; then
            cat > temp_index.md << 'EOF'
          ---
          title: "Admin Panel Documentation"
          linkTitle: "Documentation"
          menu:
            main:
              weight: 10
          ---
          
          EOF
            tail -n +1 _site_source/_index.md >> temp_index.md
            mv temp_index.md _site_source/_index.md
          fi
          
          # Access page
          if [ -f _site_source/access.md ]; then
            cat > temp_access.md << 'EOF'
          ---
          title: "Access"
          linkTitle: "Access"
          weight: 10
          description: >
            How to access the Navixy Admin Panel
          ---
          
          EOF
            tail -n +1 _site_source/access.md >> temp_access.md
            mv temp_access.md _site_source/access.md
          fi
          
          # Users section
          if [ -f _site_source/users/_index.md ]; then
            cat > temp_users.md << 'EOF'
          ---
          title: "Users"
          linkTitle: "Users"
          weight: 20
          description: >
            User management and administration
          ---
          
          EOF
            tail -n +1 _site_source/users/_index.md >> temp_users.md
            mv temp_users.md _site_source/users/_index.md
          fi
          
          # Users children
          weight=10
          for file in _site_source/users/*.md; do
            if [ "$(basename "$file")" != "_index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              cat > temp_file.md << EOF
          ---
          title: "$title"
          linkTitle: "$title"
          weight: $weight
          description: >
            $title documentation
          ---
          
          EOF
              tail -n +1 "$file" >> temp_file.md
              mv temp_file.md "$file"
              weight=$((weight + 10))
            fi
          done
          
          # Devices section
          if [ -f _site_source/devices/_index.md ]; then
            cat > temp_devices.md << 'EOF'
          ---
          title: "Devices"
          linkTitle: "Devices"
          weight: 30
          description: >
            Device management and configuration
          ---
          
          EOF
            tail -n +1 _site_source/devices/_index.md >> temp_devices.md
            mv temp_devices.md _site_source/devices/_index.md
          fi
          
          # Devices children
          weight=10
          for file in _site_source/devices/*.md; do
            if [ "$(basename "$file")" != "_index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              cat > temp_file.md << EOF
          ---
          title: "$title"
          linkTitle: "$title"
          weight: $weight
          description: >
            $title documentation
          ---
          
          EOF
              tail -n +1 "$file" >> temp_file.md
              mv temp_file.md "$file"
              weight=$((weight + 10))
            fi
          done
          
          # Settings section
          if [ -f _site_source/settings/_index.md ]; then
            cat > temp_settings.md << 'EOF'
          ---
          title: "Settings"
          linkTitle: "Settings"
          weight: 40
          description: >
            System and user settings configuration
          ---
          
          EOF
            tail -n +1 _site_source/settings/_index.md >> temp_settings.md
            mv temp_settings.md _site_source/settings/_index.md
          fi
          
          # Settings children
          weight=10
          for file in _site_source/settings/*.md; do
            if [ "$(basename "$file")" != "_index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              cat > temp_file.md << EOF
          ---
          title: "$title"
          linkTitle: "$title"
          weight: $weight
          description: >
            $title documentation
          ---
          
          EOF
              tail -n +1 "$file" >> temp_file.md
              mv temp_file.md "$file"
              weight=$((weight + 10))
            fi
          done
          
          # Settings subdirectories
          for subdir in _site_source/settings/*/; do
            if [ -d "$subdir" ]; then
              subdir_name=$(basename "$subdir")
              subdir_title=$(echo "$subdir_name" | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              
              # Subdir index
              if [ -f "$subdir/_index.md" ]; then
                cat > temp_subdir.md << EOF
          ---
          title: "$subdir_title"
          linkTitle: "$subdir_title"
          weight: $weight
          description: >
            $subdir_title configuration
          ---
          
          EOF
                tail -n +1 "$subdir/_index.md" >> temp_subdir.md
                mv temp_subdir.md "$subdir/_index.md"
                weight=$((weight + 10))
              fi
              
              # Subdir children
              child_weight=10
              for file in "$subdir"*.md; do
                if [ "$(basename "$file")" != "_index.md" ] && [ -f "$file" ]; then
                  title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
                  cat > temp_file.md << EOF
          ---
          title: "$title"
          linkTitle: "$title"
          weight: $child_weight
          description: >
            $title documentation
          ---
          
          EOF
                  tail -n +1 "$file" >> temp_file.md
                  mv temp_file.md "$file"
                  child_weight=$((child_weight + 10))
                fi
              done
            fi
          done
          
          # Plans section
          if [ -f _site_source/plans/_index.md ]; then
            cat > temp_plans.md << 'EOF'
          ---
          title: "Plans"
          linkTitle: "Plans"
          weight: 50
          description: >
            Plan management and configuration
          ---
          
          EOF
            tail -n +1 _site_source/plans/_index.md >> temp_plans.md
            mv temp_plans.md _site_source/plans/_index.md
          fi
          
          # Plans children
          weight=10
          for file in _site_source/plans/*.md; do
            if [ "$(basename "$file")" != "_index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              cat > temp_file.md << EOF
          ---
          title: "$title"
          linkTitle: "$title"
          weight: $weight
          description: >
            $title documentation
          ---
          
          EOF
              tail -n +1 "$file" >> temp_file.md
              mv temp_file.md "$file"
              weight=$((weight + 10))
            fi
          done
          
          # Reports and Resellers
          if [ -f _site_source/reports.md ]; then
            cat > temp_reports.md << 'EOF'
          ---
          title: "Reports"
          linkTitle: "Reports"
          weight: 60
          description: >
            Reporting and analytics
          ---
          
          EOF
            tail -n +1 _site_source/reports.md >> temp_reports.md
            mv temp_reports.md _site_source/reports.md
          fi
          
          if [ -f _site_source/resellers.md ]; then
            cat > temp_resellers.md << 'EOF'
          ---
          title: "Resellers"
          linkTitle: "Resellers"
          weight: 70
          description: >
            Reseller management
          ---
          
          EOF
            tail -n +1 _site_source/resellers.md >> temp_resellers.md
            mv temp_resellers.md _site_source/resellers.md
          fi

      - name: Create Jekyll configuration for Docsy
        run: |
          cat > _site_source/_config.yml << 'EOF'
          title: "Admin Panel Documentation"
          description: "Navixy Admin Panel Administration Guide"
          baseurl: "/udoc"
          url: "https://amasyunin.github.io"
          
          # Use Docsy Jekyll theme
          remote_theme: "vsoch/docsy-jekyll"
          
          # Site settings
          author: "Navixy"
          email: "support@navixy.com"
          
          # Search settings
          search_enabled: true
          
          # Defaults
          defaults:
            - scope:
                path: ""
                type: "pages"
              values:
                layout: "page"
          
          # Plugins
          plugins:
            - jekyll-feed
            - jekyll-sitemap
            - jekyll-seo-tag
          
          # Markdown settings
          markdown: kramdown
          highlighter: rouge
          
          kramdown:
            syntax_highlighter_opts:
              block:
                line_numbers: false
          
          # Exclude files
          exclude:
            - SUMMARY.md
            - Gemfile
            - Gemfile.lock
            - node_modules/
            - vendor/
            - README.md
          EOF

      - name: Create custom styling to remove branding
        run: |
          mkdir -p _site_source/assets/css
          cat > _site_source/assets/css/custom.css << 'EOF'
          /* Remove any theme branding */
          .footer .text-muted,
          .footer small,
          footer .text-muted,
          footer small {
            display: none !important;
          }
          
          /* Hide "powered by" text */
          *[class*="powered"],
          *[class*="theme"],
          *:contains("Docsy"),
          *:contains("Jekyll") {
            display: none !important;
          }
          
          /* Custom footer styling */
          .footer {
            text-align: center;
            padding: 2rem 0;
            border-top: 1px solid #e9ecef;
          }
          
          /* Ensure navigation is properly styled */
          .sidebar {
            background-color: #f8f9fa;
          }
          
          .sidebar .nav-link {
            color: #495057;
          }
          
          .sidebar .nav-link:hover {
            color: #007bff;
            background-color: #e9ecef;
          }
          EOF
          
          # Create head custom include
          mkdir -p _site_source/_includes
          cat > _site_source/_includes/head_custom.html << 'EOF'
          <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
          EOF

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_source
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
