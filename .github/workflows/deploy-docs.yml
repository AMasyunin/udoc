name: Deploy Admin Panel Docs

on:
  push:
    branches: [ main, master, userdocs ]
    paths: [ 'docs/admin-panel/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare content for Minimal Mistakes
        run: |
          # Create site directory
          mkdir -p _site_source
          
          # Copy admin-panel content
          cp -r docs/admin-panel/* _site_source/
          
          # Rename all README.md files to index.md
          find _site_source -name "README.md" -exec sh -c '
            dir=$(dirname "$1")
            mv "$1" "$dir/index.md"
            echo "Renamed $1 to $dir/index.md"
          ' _ {} \;
          
          # Fix GitBook syntax
          find _site_source -name "*.md" -type f -exec sed -i 's/{% hint style="[^"]*" %}/> **Note:** /g' {} \;
          find _site_source -name "*.md" -type f -exec sed -i 's/{% endhint %}/\n/g' {} \;
          find _site_source -name "*.md" -type f -exec sed -i 's/{% hint %}/> **Note:** /g' {} \;

      - name: Add Minimal Mistakes front matter
        run: |
          # Root index page
          if [ -f _site_source/index.md ]; then
            cat > temp_index.md << 'EOF'
          ---
          layout: single
          title: "Admin Panel Documentation"
          permalink: /
          sidebar:
            nav: "docs"
          ---
          
          EOF
            tail -n +1 _site_source/index.md >> temp_index.md
            mv temp_index.md _site_source/index.md
          fi
          
          # Access page
          if [ -f _site_source/access.md ]; then
            cat > temp_access.md << 'EOF'
          ---
          layout: single
          title: Access
          permalink: /access/
          sidebar:
            nav: "docs"
          ---
          
          EOF
            tail -n +1 _site_source/access.md >> temp_access.md
            mv temp_access.md _site_source/access.md
          fi
          
          # Users section
          if [ -f _site_source/users/index.md ]; then
            cat > temp_users.md << 'EOF'
          ---
          layout: single
          title: Users
          permalink: /users/
          sidebar:
            nav: "docs"
          ---
          
          EOF
            tail -n +1 _site_source/users/index.md >> temp_users.md
            mv temp_users.md _site_source/users/index.md
          fi
          
          # Users children
          for file in _site_source/users/*.md; do
            if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              permalink="/users/$(basename "$file" .md)/"
              cat > temp_file.md << EOF
          ---
          layout: single
          title: "$title"
          permalink: "$permalink"
          sidebar:
            nav: "docs"
          ---
          
          EOF
              tail -n +1 "$file" >> temp_file.md
              mv temp_file.md "$file"
            fi
          done
          
          # Devices section
          if [ -f _site_source/devices/index.md ]; then
            cat > temp_devices.md << 'EOF'
          ---
          layout: single
          title: Devices
          permalink: /devices/
          sidebar:
            nav: "docs"
          ---
          
          EOF
            tail -n +1 _site_source/devices/index.md >> temp_devices.md
            mv temp_devices.md _site_source/devices/index.md
          fi
          
          # Devices children
          for file in _site_source/devices/*.md; do
            if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              permalink="/devices/$(basename "$file" .md)/"
              cat > temp_file.md << EOF
          ---
          layout: single
          title: "$title"
          permalink: "$permalink"
          sidebar:
            nav: "docs"
          ---
          
          EOF
              tail -n +1 "$file" >> temp_file.md
              mv temp_file.md "$file"
            fi
          done
          
          # Settings section
          if [ -f _site_source/settings/index.md ]; then
            cat > temp_settings.md << 'EOF'
          ---
          layout: single
          title: Settings
          permalink: /settings/
          sidebar:
            nav: "docs"
          ---
          
          EOF
            tail -n +1 _site_source/settings/index.md >> temp_settings.md
            mv temp_settings.md _site_source/settings/index.md
          fi
          
          # Settings children
          for file in _site_source/settings/*.md; do
            if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              permalink="/settings/$(basename "$file" .md)/"
              cat > temp_file.md << EOF
          ---
          layout: single
          title: "$title"
          permalink: "$permalink"
          sidebar:
            nav: "docs"
          ---
          
          EOF
              tail -n +1 "$file" >> temp_file.md
              mv temp_file.md "$file"
            fi
          done
          
          # Settings subdirectories
          for subdir in _site_source/settings/*/; do
            if [ -d "$subdir" ]; then
              subdir_name=$(basename "$subdir")
              subdir_title=$(echo "$subdir_name" | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              
              # Subdir index
              if [ -f "$subdir/index.md" ]; then
                cat > temp_subdir.md << EOF
          ---
          layout: single
          title: "$subdir_title"
          permalink: "/settings/$subdir_name/"
          sidebar:
            nav: "docs"
          ---
          
          EOF
                tail -n +1 "$subdir/index.md" >> temp_subdir.md
                mv temp_subdir.md "$subdir/index.md"
              fi
              
              # Subdir children
              for file in "$subdir"*.md; do
                if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
                  title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
                  permalink="/settings/$subdir_name/$(basename "$file" .md)/"
                  cat > temp_file.md << EOF
          ---
          layout: single
          title: "$title"
          permalink: "$permalink"
          sidebar:
            nav: "docs"
          ---
          
          EOF
                  tail -n +1 "$file" >> temp_file.md
                  mv temp_file.md "$file"
                fi
              done
            fi
          done
          
          # Plans section
          if [ -f _site_source/plans/index.md ]; then
            cat > temp_plans.md << 'EOF'
          ---
          layout: single
          title: Plans
          permalink: /plans/
          sidebar:
            nav: "docs"
          ---
          
          EOF
            tail -n +1 _site_source/plans/index.md >> temp_plans.md
            mv temp_plans.md _site_source/plans/index.md
          fi
          
          # Plans children
          for file in _site_source/plans/*.md; do
            if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              permalink="/plans/$(basename "$file" .md)/"
              cat > temp_file.md << EOF
          ---
          layout: single
          title: "$title"
          permalink: "$permalink"
          sidebar:
            nav: "docs"
          ---
          
          EOF
              tail -n +1 "$file" >> temp_file.md
              mv temp_file.md "$file"
            fi
          done
          
          # Reports and Resellers
          if [ -f _site_source/reports.md ]; then
            cat > temp_reports.md << 'EOF'
          ---
          layout: single
          title: Reports
          permalink: /reports/
          sidebar:
            nav: "docs"
          ---
          
          EOF
            tail -n +1 _site_source/reports.md >> temp_reports.md
            mv temp_reports.md _site_source/reports.md
          fi
          
          if [ -f _site_source/resellers.md ]; then
            cat > temp_resellers.md << 'EOF'
          ---
          layout: single
          title: Resellers
          permalink: /resellers/
          sidebar:
            nav: "docs"
          ---
          
          EOF
            tail -n +1 _site_source/resellers.md >> temp_resellers.md
            mv temp_resellers.md _site_source/resellers.md
          fi

      - name: Create dynamic navigation structure
        run: |
          mkdir -p _site_source/_data
          
          # Generate navigation based on actual files
          cat > _site_source/_data/navigation.yml << 'EOF'
          docs:
            - title: "Home"
              url: /
            - title: "Access"
              url: /access/
            - title: "Users"
              url: /users/
              children:
          EOF
          
          # Add Users children dynamically
          for file in _site_source/users/*.md; do
            if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              url="/users/$(basename "$file" .md)/"
              echo "        - title: \"$title\"" >> _site_source/_data/navigation.yml
              echo "          url: $url" >> _site_source/_data/navigation.yml
            fi
          done
          
          cat >> _site_source/_data/navigation.yml << 'EOF'
            - title: "Devices"
              url: /devices/
              children:
          EOF
          
          # Add Devices children dynamically
          for file in _site_source/devices/*.md; do
            if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              url="/devices/$(basename "$file" .md)/"
              echo "        - title: \"$title\"" >> _site_source/_data/navigation.yml
              echo "          url: $url" >> _site_source/_data/navigation.yml
            fi
          done
          
          cat >> _site_source/_data/navigation.yml << 'EOF'
            - title: "Settings"
              url: /settings/
              children:
          EOF
          
          # Add Settings children dynamically
          for file in _site_source/settings/*.md; do
            if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              url="/settings/$(basename "$file" .md)/"
              echo "        - title: \"$title\"" >> _site_source/_data/navigation.yml
              echo "          url: $url" >> _site_source/_data/navigation.yml
            fi
          done
          
          # Add Settings subdirectories
          for subdir in _site_source/settings/*/; do
            if [ -d "$subdir" ]; then
              subdir_name=$(basename "$subdir")
              subdir_title=$(echo "$subdir_name" | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              echo "        - title: \"$subdir_title\"" >> _site_source/_data/navigation.yml
              echo "          url: /settings/$subdir_name/" >> _site_source/_data/navigation.yml
              echo "          children:" >> _site_source/_data/navigation.yml
              
              # Add subdir children
              for file in "$subdir"*.md; do
                if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
                  title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
                  url="/settings/$subdir_name/$(basename "$file" .md)/"
                  echo "          - title: \"$title\"" >> _site_source/_data/navigation.yml
                  echo "            url: $url" >> _site_source/_data/navigation.yml
                fi
              done
            fi
          done
          
          cat >> _site_source/_data/navigation.yml << 'EOF'
            - title: "Plans"
              url: /plans/
              children:
          EOF
          
          # Add Plans children dynamically
          for file in _site_source/plans/*.md; do
            if [ "$(basename "$file")" != "index.md" ] && [ -f "$file" ]; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              url="/plans/$(basename "$file" .md)/"
              echo "        - title: \"$title\"" >> _site_source/_data/navigation.yml
              echo "          url: $url" >> _site_source/_data/navigation.yml
            fi
          done
          
          cat >> _site_source/_data/navigation.yml << 'EOF'
            - title: "Reports"
              url: /reports/
            - title: "Resellers"
              url: /resellers/
          EOF

      - name: Create custom CSS for better navigation
        run: |
          mkdir -p _site_source/assets/css
          cat > _site_source/assets/css/custom.css << 'EOF'
          /* Hide footer completely */
          .page__footer {
            display: none !important;
          }
          
          /* Style collapsible navigation */
          .nav__list .nav__items {
            padding-left: 0;
          }
          
          .nav__list .nav__items .nav__item {
            margin: 0;
          }
          
          /* Ensure navigation children are collapsible */
          .nav__list .nav__items .nav__item .nav__sub-title {
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 0.5em;
          }
          
          /* Hide theme attribution */
          .page__footer-copyright,
          .page__footer-follow,
          footer {
            display: none !important;
          }
          EOF
          
          # Create custom head include
          mkdir -p _site_source/_includes
          cat > _site_source/_includes/head_custom.html << 'EOF'
          <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
          EOF

      - name: Create Jekyll configuration
        run: |
          cat > _site_source/_config.yml << 'EOF'
          title: "Admin Panel Documentation"
          description: "Navixy Admin Panel Administration Guide"
          baseurl: "/udoc"
          url: "https://amasyunin.github.io"
          
          remote_theme: "mmistakes/minimal-mistakes@4.24.0"
          
          # Minimal Mistakes theme configuration
          minimal_mistakes_skin: "default"
          
          # Search enabled
          search: true
          search_full_content: true
          
          # Site settings
          locale: "en-US"
          name: "Navixy"
          
          # Remove footer completely
          footer: false
          
          # Remove author and other elements
          author:
            name: false
          
          # Disable social sharing and related posts
          defaults:
            - scope:
                path: ""
                type: pages
              values:
                layout: single
                author_profile: false
                read_time: false
                comments: false
                share: false
                related: false
                show_date: false
                sidebar:
                  nav: "docs"
          
          markdown: kramdown
          highlighter: rouge
          
          kramdown:
            syntax_highlighter_opts:
              block:
                line_numbers: false
          
          exclude:
            - SUMMARY.md
            - Gemfile
            - Gemfile.lock
            - node_modules/
            - vendor/
          
          plugins:
            - jekyll-paginate
            - jekyll-sitemap
            - jekyll-gist
            - jekyll-feed
            - jekyll-include-cache
          EOF

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_source
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
