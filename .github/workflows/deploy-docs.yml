name: Deploy Admin Panel Docs

on:
  push:
    branches: [ main, master, userdocs ]
    paths: [ 'docs/admin-panel/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare content
        run: |
          # Create site directory
          mkdir -p _site_source
          
          # Copy admin-panel content
          cp -r docs/admin-panel/* _site_source/
          
          # Rename all README.md files to index.md
          find _site_source -name "README.md" -exec sh -c '
            dir=$(dirname "$1")
            mv "$1" "$dir/index.md"
            echo "Renamed $1 to $dir/index.md"
          ' _ {} \;
          
          # Fix GitBook syntax
          find _site_source -name "*.md" -type f -exec sed -i 's/{% hint style="[^"]*" %}/> **Note:** /g' {} \;
          find _site_source -name "*.md" -type f -exec sed -i 's/{% endhint %}/\n/g' {} \;
          find _site_source -name "*.md" -type f -exec sed -i 's/{% hint %}/> **Note:** /g' {} \;
          
          # Remove the first heading only from top-level section index files (to avoid duplication with layout title)
          for section_index in _site_source/users/index.md _site_source/devices/index.md _site_source/settings/index.md _site_source/plans/index.md; do
            if [ -f "$section_index" ]; then
              sed -i '/^# /{ N; s/^# .*\n//; }' "$section_index"
            fi
          done

      - name: Add front matter to all pages
        run: |
          # Root index page - special handling
          if [ -f _site_source/index.md ]; then
            cat > temp_index.md << 'EOF'
          ---
          layout: default
          title: "Admin Panel"
          hide_title: false
          ---
          
          EOF
            tail -n +1 _site_source/index.md >> temp_index.md
            mv temp_index.md _site_source/index.md
          fi
          
          # Add front matter to all markdown files
          find _site_source -name "*.md" -not -name "index.md" -type f | while read file; do
            if ! head -n 1 "$file" | grep -q "^---$"; then
              title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              
              # Check if this is a top-level section index file
              if [[ "$file" == *"/users/index.md" ]] || [[ "$file" == *"/devices/index.md" ]] || [[ "$file" == *"/settings/index.md" ]] || [[ "$file" == *"/plans/index.md" ]]; then
                hide_title="false"
              else
                hide_title="true"
              fi
              
              cat > temp_file.md << 'EOF'
          ---
          layout: default
          title: "TITLE_PLACEHOLDER"
          hide_title: HIDE_TITLE_PLACEHOLDER
          ---
          
          EOF
              # Replace placeholders with actual values
              sed "s/TITLE_PLACEHOLDER/$title/g" temp_file.md | sed "s/HIDE_TITLE_PLACEHOLDER/$hide_title/g" > temp_file2.md
              cat "$file" >> temp_file2.md
              mv temp_file2.md "$file"
              rm -f temp_file.md
            fi
          done

      - name: Create custom Jekyll layout
        run: |
          mkdir -p _site_source/_layouts
          cat > _site_source/_layouts/default.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>{{ page.title }} - Admin Panel Documentation</title>
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
                      line-height: 1.6;
                      color: #333;
                      background-color: #f8f9fa;
                  }
                  
                  .container {
                      display: flex;
                      min-height: 100vh;
                  }
                  
                  .sidebar {
                      width: 280px;
                      background: white;
                      border-right: 1px solid #e1e4e8;
                      padding: 20px 0;
                      overflow-y: auto;
                      position: fixed;
                      height: 100vh;
                  }
                  
                  .sidebar h3 {
                      padding: 0 20px 10px;
                      font-size: 18px;
                      color: #24292e;
                      border-bottom: 1px solid #e1e4e8;
                      margin-bottom: 15px;
                  }
                  
                  .nav-section {
                      margin-bottom: 20px;
                  }
                  
                  .nav-section-title {
                      padding: 8px 20px;
                      font-weight: 600;
                      color: #586069;
                      cursor: pointer;
                      background: #f6f8fa;
                      border-left: 3px solid transparent;
                      text-decoration: none;
                      display: block;
                  }
                  
                  .nav-section-title:hover {
                      background: #e1e4e8;
                      color: #586069;
                  }
                  
                  .nav-section-title.active {
                      background: #0366d6;
                      color: white;
                      border-left-color: #0366d6;
                  }
                  
                  .nav-items {
                      display: none;
                      padding-left: 15px;
                  }
                  
                  .nav-items.show {
                      display: block;
                  }
                  
                  .nav-items a {
                      display: block;
                      padding: 6px 20px;
                      color: #586069;
                      text-decoration: none;
                      font-size: 14px;
                      border-left: 3px solid transparent;
                  }
                  
                  .nav-items a:hover {
                      color: #0366d6;
                      background: #f6f8fa;
                  }
                  
                  .nav-items a.active {
                      color: #0366d6;
                      background: #f6f8fa;
                      border-left-color: #0366d6;
                      font-weight: 500;
                  }
                  
                  .content {
                      flex: 1;
                      margin-left: 280px;
                      padding: 40px;
                      background: white;
                      min-height: 100vh;
                  }
                  
                  .content h1 {
                      font-size: 32px;
                      margin-bottom: 16px;
                      color: #24292e;
                      border-bottom: 1px solid #e1e4e8;
                      padding-bottom: 10px;
                  }
                  
                  .content h1.hidden {
                      display: none;
                  }
                  
                  .content h2 {
                      font-size: 24px;
                      margin: 32px 0 16px;
                      color: #24292e;
                  }
                  
                  .content h3 {
                      font-size: 20px;
                      margin: 24px 0 12px;
                      color: #24292e;
                  }
                  
                  .content p {
                      margin-bottom: 16px;
                      color: #586069;
                  }
                  
                  .content blockquote {
                      margin: 16px 0;
                      padding: 16px;
                      background: #f6f8fa;
                      border-left: 4px solid #0366d6;
                      border-radius: 4px;
                  }
                  
                  .content blockquote p {
                      margin: 0;
                  }
                  
                  .content ul, .content ol {
                      margin-bottom: 16px;
                      padding-left: 24px;
                  }
                  
                  .content li {
                      margin-bottom: 4px;
                  }
                  
                  .content code {
                      background: #f6f8fa;
                      padding: 2px 6px;
                      border-radius: 3px;
                      font-size: 14px;
                      font-family: 'SF Mono', Monaco, monospace;
                  }
                  
                  .content pre {
                      background: #f6f8fa;
                      padding: 16px;
                      border-radius: 6px;
                      overflow-x: auto;
                      margin-bottom: 16px;
                  }
                  
                  .content pre code {
                      background: none;
                      padding: 0;
                  }
                  
                  @media (max-width: 768px) {
                      .sidebar {
                          transform: translateX(-100%);
                          transition: transform 0.3s;
                      }
                      
                      .content {
                          margin-left: 0;
                      }
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <nav class="sidebar">
                      <h3>Admin Panel</h3>
                      
                      <div class="nav-section">
                          <a href="{{ '/index.html' | relative_url }}" class="nav-section-title" data-section="getting-started">Getting Started</a>
                          <div class="nav-items" id="getting-started">
                              <a href="{{ '/access.html' | relative_url }}">Access</a>
                          </div>
                      </div>
                      
                      <div class="nav-section">
                          <a href="{{ '/users/index.html' | relative_url }}" class="nav-section-title" data-section="users">Users</a>
                          <div class="nav-items" id="users">
                              <a href="{{ '/users/billing-operations.html' | relative_url }}">Billing Operations</a>
                              <a href="{{ '/users/create-user.html' | relative_url }}">Create User</a>
                              <a href="{{ '/users/delete-user.html' | relative_url }}">Delete User</a>
                              <a href="{{ '/users/user-details.html' | relative_url }}">User Details</a>
                          </div>
                      </div>
                      
                      <div class="nav-section">
                          <a href="{{ '/devices/index.html' | relative_url }}" class="nav-section-title" data-section="devices">Devices</a>
                          <div class="nav-items" id="devices">
                              <a href="{{ '/devices/air-console.html' | relative_url }}">Air Console</a>
                              <a href="{{ '/devices/basic-operations.html' | relative_url }}">Basic Operations</a>
                              <a href="{{ '/devices/bulk-activation.html' | relative_url }}">Bulk Activation</a>
                              <a href="{{ '/devices/change-plan.html' | relative_url }}">Change Plan</a>
                              <a href="{{ '/devices/tracker-clones.html' | relative_url }}">Tracker Clones</a>
                          </div>
                      </div>
                      
                      <div class="nav-section">
                          <a href="{{ '/settings/index.html' | relative_url }}" class="nav-section-title" data-section="settings">Settings</a>
                          <div class="nav-items" id="settings">
                              <a href="{{ '/settings/branding-options.html' | relative_url }}">Branding Options</a>
                              <a href="{{ '/settings/custom-menu-editor.html' | relative_url }}">Custom Menu Editor</a>
                              <a href="{{ '/settings/domain-name.html' | relative_url }}">Domain Name</a>
                              <a href="{{ '/settings/payment-gateway.html' | relative_url }}">Payment Gateway</a>
                              <a href="{{ '/settings/two-factor-authentication.html' | relative_url }}">Two Factor Authentication</a>
                              <a href="{{ '/settings/maps/index.html' | relative_url }}">Maps</a>
                              <a href="{{ '/settings/messaging-gateways/index.html' | relative_url }}">Messaging Gateways</a>
                              <a href="{{ '/settings/service-preferences/index.html' | relative_url }}">Service Preferences</a>
                          </div>
                      </div>
                      
                      <div class="nav-section">
                          <a href="{{ '/plans/index.html' | relative_url }}" class="nav-section-title" data-section="plans">Plans</a>
                          <div class="nav-items" id="plans">
                              <a href="{{ '/plans/activation-codes.html' | relative_url }}">Activation Codes</a>
                              <a href="{{ '/plans/assets-are-not-displayed-in-the-account.html' | relative_url }}">Assets Are Not Displayed</a>
                              <a href="{{ '/plans/pricing-plans-conflicts.html' | relative_url }}">Pricing Plans Conflicts</a>
                              <a href="{{ '/plans/suspending-service-for-a-device.html' | relative_url }}">Suspending Service</a>
                          </div>
                      </div>
                      
                      <div class="nav-section">
                          <div class="nav-section-title" data-section="other">Other</div>
                          <div class="nav-items" id="other">
                              <a href="{{ '/reports.html' | relative_url }}">Reports</a>
                              <a href="{{ '/resellers.html' | relative_url }}">Resellers</a>
                          </div>
                      </div>
                  </nav>
                  
                  <main class="content">
                      {% unless page.hide_title %}
                      <h1>{{ page.title }}</h1>
                      {% endunless %}
                      {{ content }}
                  </main>
              </div>
              
              <script>
                  document.addEventListener('DOMContentLoaded', function() {
                      const sectionTitles = document.querySelectorAll('.nav-section-title');
                      const currentPath = window.location.pathname;
                      
                      // Handle section title clicks
                      sectionTitles.forEach(title => {
                          const sectionId = title.getAttribute('data-section');
                          const section = document.getElementById(sectionId);
                          
                          if (section && !title.href) {
                              // Only add click handler if it's not a link (like "Other")
                              title.addEventListener('click', function(e) {
                                  e.preventDefault();
                                  toggleSection(sectionId);
                              });
                          }
                      });
                      
                      // Auto-open section and highlight current page
                      let sectionToOpen = null;
                      
                      if (currentPath.includes('/users/')) sectionToOpen = 'users';
                      else if (currentPath.includes('/devices/')) sectionToOpen = 'devices';
                      else if (currentPath.includes('/settings/')) sectionToOpen = 'settings';
                      else if (currentPath.includes('/plans/')) sectionToOpen = 'plans';
                      else if (currentPath.includes('/reports') || currentPath.includes('/resellers')) sectionToOpen = 'other';
                      else sectionToOpen = 'getting-started';
                      
                      if (sectionToOpen) {
                          openSection(sectionToOpen);
                          
                          // Highlight current page
                          document.querySelectorAll('.nav-items a, .nav-section-title').forEach(link => {
                              const linkPath = link.getAttribute('href');
                              if (linkPath && (currentPath.endsWith(linkPath) || linkPath.endsWith(currentPath.split('/').pop()))) {
                                  link.classList.add('active');
                              }
                          });
                      }
                  });
                  
                  function toggleSection(sectionId) {
                      const section = document.getElementById(sectionId);
                      const title = document.querySelector(`[data-section="${sectionId}"]`);
                      
                      if (section.classList.contains('show')) {
                          section.classList.remove('show');
                          title.classList.remove('active');
                      } else {
                          // Close other sections
                          document.querySelectorAll('.nav-items').forEach(item => {
                              item.classList.remove('show');
                          });
                          document.querySelectorAll('.nav-section-title').forEach(item => {
                              item.classList.remove('active');
                          });
                          
                          // Open current section
                          section.classList.add('show');
                          title.classList.add('active');
                      }
                  }
                  
                  function openSection(sectionId) {
                      const section = document.getElementById(sectionId);
                      const title = document.querySelector(`[data-section="${sectionId}"]`);
                      
                      if (section && title) {
                          section.classList.add('show');
                          title.classList.add('active');
                      }
                  }
              </script>
          </body>
          </html>
          EOF

      - name: Create Jekyll configuration
        run: |
          cat > _site_source/_config.yml << 'EOF'
          title: "Admin Panel Documentation"
          description: "Navixy Admin Panel Administration Guide"
          baseurl: "/udoc"
          url: "https://amasyunin.github.io"
          
          markdown: kramdown
          highlighter: rouge
          
          kramdown:
            input: GFM
            syntax_highlighter: rouge
          
          exclude:
            - SUMMARY.md
            - Gemfile
            - Gemfile.lock
            - node_modules/
            - vendor/
            - README.md
          
          plugins:
            - jekyll-seo-tag
          EOF

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_source
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
