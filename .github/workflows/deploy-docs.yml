name: Deploy Admin Panel Docs

on:
  push:
    branches: [ main, master, userdocs ]
    paths: [ 'docs/admin-panel/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare content for Jekyll
        run: |
          # Create site directory
          mkdir -p _site_source
          
          # Copy admin-panel content
          cp -r docs/admin-panel/* _site_source/
          
          echo "=== ORIGINAL STRUCTURE ==="
          find _site_source -name "*.md" | sort
          echo "=== END ORIGINAL STRUCTURE ==="
          
          # Rename all README.md files to index.md for clean URLs
          find _site_source -name "README.md" -exec sh -c '
            dir=$(dirname "$1")
            mv "$1" "$dir/index.md"
            echo "Renamed $1 to $dir/index.md"
          ' _ {} \;
          
          # Fix GitBook syntax
          find _site_source -name "*.md" -type f -exec sed -i 's/{% hint style="[^"]*" %}/> **Note:** /g' {} \;
          find _site_source -name "*.md" -type f -exec sed -i 's/{% endhint %}/\n/g' {} \;
          find _site_source -name "*.md" -type f -exec sed -i 's/{% hint %}/> **Note:** /g' {} \;
          
          # Add front matter to all markdown files
          for file in $(find _site_source -name "*.md" -type f); do
            if ! head -1 "$file" | grep -q "^---"; then
              # Extract title from filename or first heading
              filename=$(basename "$file" .md)
              if [ "$filename" = "index" ]; then
                # For index files, use directory name
                dirname=$(basename $(dirname "$file"))
                if [ "$dirname" = "_site_source" ]; then
                  title="Admin Panel Documentation"
                else
                  title=$(echo "$dirname" | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
                fi
              else
                title=$(echo "$filename" | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              fi
              
              # Create temp file with front matter
              temp_file="/tmp/temp_$(basename "$file")"
              echo "---" > "$temp_file"
              echo "layout: page" >> "$temp_file"
              echo "title: \"$title\"" >> "$temp_file"
              echo "---" >> "$temp_file"
              echo "" >> "$temp_file"
              cat "$file" >> "$temp_file"
              mv "$temp_file" "$file"
              echo "Added front matter to $file with title: $title"
            fi
          done
          
          echo "=== FINAL STRUCTURE ==="
          find _site_source -name "*.md" | sort
          echo "=== END FINAL STRUCTURE ==="

      - name: Create navigation data
        run: |
          # Create _data directory
          mkdir -p _site_source/_data
          
          # Generate navigation from SUMMARY.md
          python3 -c "
          import os
          import re
          import yaml
          
          def parse_summary():
              nav = {'main': [], 'sections': {}}
              
              try:
                  with open('_site_source/SUMMARY.md', 'r') as f:
                      content = f.read()
                      
                  current_section = None
                  
                  for line in content.split('\n'):
                      line = line.strip()
                      if not line or line.startswith('#'):
                          continue
                      
                      # Count indentation
                      indent = 0
                      original = line
                      while line.startswith('  '):
                          indent += 1
                          line = line[2:]
                      
                      # Parse markdown link
                      match = re.match(r'\* \[(.+?)\]\((.+?)\)', line)
                      if match:
                          title = match.group(1)
                          path = match.group(2)
                          
                          # Convert path to Jekyll URL
                          if path == 'README.md':
                              url = '/'
                          elif path.endswith('/README.md'):
                              url = '/' + path.replace('/README.md', '') + '/'
                          else:
                              url = '/' + path.replace('.md', '.html')
                          
                          item = {'title': title, 'url': url}
                          
                          if indent == 0:
                              if title in ['Users', 'Devices', 'Settings', 'Plans']:
                                  current_section = title
                                  nav['sections'][title] = {'main': item, 'children': []}
                              else:
                                  nav['main'].append(item)
                          elif indent == 1 and current_section:
                              nav['sections'][current_section]['children'].append(item)
              
              except FileNotFoundError:
                  print('SUMMARY.md not found, creating basic structure')
                  nav = {
                      'main': [
                          {'title': 'Admin Panel', 'url': '/'},
                          {'title': 'Access', 'url': '/access.html'}
                      ],
                      'sections': {
                          'Users': {
                              'main': {'title': 'Users', 'url': '/users/'},
                              'children': []
                          }
                      }
                  }
              
              return nav
          
          nav_data = parse_summary()
          
          with open('_site_source/_data/navigation.yml', 'w') as f:
              yaml.dump(nav_data, f, default_flow_style=False, sort_keys=False)
          
          print('=== GENERATED NAVIGATION ===')
          print(yaml.dump(nav_data, default_flow_style=False))
          print('=== END NAVIGATION ===')
          "

      - name: Create Jekyll configuration
        run: |
          cat > _site_source/_config.yml << 'EOF'
          title: "Admin Panel Documentation"
          description: "Administration Guide"  
          baseurl: "/udoc"
          url: "https://amasyunin.github.io"
          
          theme: minima
          
          markdown: kramdown
          highlighter: rouge
          
          plugins:
            - jekyll-feed
            - jekyll-sitemap
          
          # Tell Minima which pages to show in header
          header_pages:
            - index.md
            - access.md
          
          exclude:
            - SUMMARY.md
            - Gemfile
            - Gemfile.lock
          EOF

      - name: Create custom navigation include
        run: |
          mkdir -p _site_source/_includes
          
          cat > _site_source/_includes/header.html << 'EOF'
          <header class="site-header">
            <div class="wrapper">
              <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
              
              <nav class="site-nav">
                <input type="checkbox" id="nav-trigger" class="nav-trigger" />
                <label for="nav-trigger">
                  <span class="menu-icon">
                    <svg viewBox="0 0 18 15" width="18px" height="15px">
                      <path d="m0,3h18v2h-18z"/>
                      <path d="m0,8h18v2h-18z"/>  
                      <path d="m0,13h18v2h-18z"/>
                    </svg>
                  </span>
                </label>

                <div class="trigger">
                  <!-- Main pages -->
                  {% for item in site.data.navigation.main %}
                    <a class="page-link" href="{{ item.url | relative_url }}">{{ item.title }}</a>
                  {% endfor %}
                  
                  <!-- Section dropdowns -->
                  {% for section in site.data.navigation.sections %}
                    <div class="dropdown">
                      <a class="page-link dropdown-toggle" href="{{ section[1].main.url | relative_url }}">
                        {{ section[1].main.title }} ▼
                      </a>
                      <div class="dropdown-content">
                        <a href="{{ section[1].main.url | relative_url }}">{{ section[1].main.title }} Overview</a>
                        {% for child in section[1].children %}
                          <a href="{{ child.url | relative_url }}">{{ child.title }}</a>
                        {% endfor %}
                      </div>
                    </div>
                  {% endfor %}
                </div>
              </nav>
            </div>
          </header>
          EOF

      - name: Add dropdown CSS
        run: |
          mkdir -p _site_source/assets/css
          
          cat > _site_source/assets/css/main.scss << 'EOF'
          ---
          ---
          @import "{{ site.theme }}";
          
          .dropdown {
            position: relative;
            display: inline-block;
          }
          
          .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 200px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            right: 0;
          }
          
          .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
          }
          
          .dropdown-content a:hover {
            background-color: #f1f1f1;
          }
          
          .dropdown:hover .dropdown-content {
            display: block;
          }
          
          .dropdown-toggle {
            cursor: pointer;
          }
          EOF

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_source
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
