                      title = match.group(2).strip()
                      anchor = re.sub(r'[^\w\s-]', '', title.lower())
                      anchor = re.sub(r'[-\s]+', '-', anchor).strip('-')
                      headings.append({
                          'level': level,
                          'title': title,
                          'anchor': anchor
                      })
                  
                  return headings
              except Exception as e:
                  print(f"Error reading {filepath}: {e}")
                  return []
          
          # Check if index.md exists and extract TOC
          nav_html = []
          if os.path.exists('_site_source/index.md'):
              headings = extract_headings('_site_source/index.md')
              
              print("=== FOUND HEADINGS ===")
              for h in headings:
                  print(f"Level {h['level']}: {h['title']} -> #{h['anchor']}")
              print("=== END HEADINGS ===")
              
              # Generate navigation HTML
              nav_html.append('<li><a href="#top">Overview</a></li>')
              
              for heading in headings:
                  indent = '  ' * (heading['level'] - 1)
                  nav_html.append(f'{indent}<li><a href="#{heading["anchor"]}">{heading["title"]}</a></li>')
          else:
              # Fallback navigation
              nav_html = [
                  '<li><a href="#top">Admin Panel Overview</a></li>',
                  '<li><a href="#access">Access</a></li>',
                  '<li><a href="#features">Features</a></li>'
              ]
          
          # Save navigation
          with open('_site_source/_navigation.html', 'w') as f:
              f.write('\n'.join(nav_html))
              
