# .github/workflows/deploy-docs.yml
name: Deploy Admin Panel Docs to GitHub Pages

on:
  push:
    branches: [ userdocs ]
    paths: 
      - 'docs/admin-panel/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: userdocs
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          
      - name: Create Jekyll site structure
        run: |
          # Create site directory
          mkdir -p _site_source
          
          # Copy admin-panel content to root of site
          cp -r docs/admin-panel/* _site_source/
          
          # Rename README.md to index.md for Jekyll homepage
          if [ -f _site_source/README.md ]; then
            mv _site_source/README.md _site_source/index.md
          fi
          
      - name: Create Jekyll configuration
        run: |
          cat > _site_source/_config.yml << 'EOF'
          title: "Admin Panel Documentation"
          description: "Administration Guide"
          baseurl: "/udoc"
          url: "https://amasyunin.github.io"
          
          theme: minima
          
          markdown: kramdown
          kramdown:
            input: GFM
            syntax_highlighter: rouge
          
          highlighter: rouge
          
          plugins:
            - jekyll-feed
            - jekyll-sitemap
            - jekyll-relative-links
            - jekyll-optional-front-matter
            - jekyll-readme-index
            - jekyll-titles-from-headings
          
          # Enable relative links
          relative_links:
            enabled: true
            collections: false
          
          # Auto-generate front matter
          optional_front_matter:
            enabled: true
          
          # Use README files as index pages
          readme_index:
            enabled: true
            remove_originals: false
          
          # Generate titles from headings
          titles_from_headings:
            enabled: true
            strip_title: true
            collections: false
          
          # Minima theme settings
          minima:
            skin: classic
          
          # Header and navigation
          header_pages:
            - index.md
          
          # Include all markdown files
          include:
            - README.md
            - "*.md"
          
          # Exclude system files
          exclude:
            - .github/
            - .gitignore
            - Gemfile
            - Gemfile.lock
            - "*.gem"
            - "*.gemspec"
            - node_modules/
            - vendor/
          EOF
          
      - name: Create Gemfile
        run: |
          cat > _site_source/Gemfile << 'EOF'
          source 'https://rubygems.org'
          
          gem 'github-pages', group: :jekyll_plugins
          gem 'minima'
          gem 'jekyll-feed'
          gem 'jekyll-sitemap'
          gem 'jekyll-relative-links'
          gem 'jekyll-optional-front-matter'
          gem 'jekyll-readme-index'
          gem 'jekyll-titles-from-headings'
          gem 'webrick'
          EOF
          
      - name: Build Jekyll site
        run: |
          cd _site_source
          bundle install
          bundle exec jekyll build --destination ../_site
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
