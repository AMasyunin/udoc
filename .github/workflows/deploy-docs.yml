name: Deploy Multi-Language Admin Panel Docs

on:
  push:
    branches: [ main, master, userdocs ]
    paths: [ 'docs/admin-panel**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Process languages
        run: |
          mkdir -p _site_source
          
          # Process English (admin-panel)
          if [ -d "docs/admin-panel" ]; then
            echo "Processing English from docs/admin-panel"
            mkdir -p "_site_source/en"
            cp -r docs/admin-panel/* "_site_source/en/"
          fi
          
          # Process Spanish (admin-panel-es/admin-panel)
          if [ -d "docs/admin-panel-es/admin-panel" ]; then
            echo "Processing Spanish from docs/admin-panel-es/admin-panel"
            mkdir -p "_site_source/es"
            cp -r docs/admin-panel-es/admin-panel/* "_site_source/es/"
          elif [ -d "docs/admin-panel-es" ]; then
            echo "Processing Spanish from docs/admin-panel-es (direct)"
            mkdir -p "_site_source/es"
            cp -r docs/admin-panel-es/* "_site_source/es/"
          fi

      - name: Fix file extensions and GitBook syntax
        run: |
          # Process both languages
          for lang_dir in _site_source/*/; do
            if [ -d "$lang_dir" ]; then
              lang=$(basename "$lang_dir")
              echo "Processing $lang"
              
              # Rename README.md to index.md
              find "$lang_dir" -name "README.md" -exec sh -c '
                dir=$(dirname "$1")
                mv "$1" "$dir/index.md"
                echo "Renamed $1 to $dir/index.md"
              ' _ {} \;
              
              # Fix GitBook syntax
              find "$lang_dir" -name "*.md" -type f -exec sed -i 's/{% hint style="[^"]*" %}/> **Note:** /g' {} \;
              find "$lang_dir" -name "*.md" -type f -exec sed -i 's/{% endhint %}/\n/g' {} \;
              find "$lang_dir" -name "*.md" -type f -exec sed -i 's/{% hint %}/> **Note:** /g' {} \;
            fi
          done

      - name: Add front matter
        run: |
          # Add front matter to all markdown files
          for lang_dir in _site_source/*/; do
            if [ -d "$lang_dir" ]; then
              lang=$(basename "$lang_dir")
              
              # Set language name
              case "$lang" in
                "en") lang_name="English" ;;
                "es") lang_name="Español" ;;
                "ru") lang_name="Русский" ;;
                "fr") lang_name="Français" ;;
                *) lang_name="$lang" ;;
              esac
              
              echo "Adding front matter for $lang ($lang_name)"
              
              # Process all markdown files
              find "$lang_dir" -name "*.md" -type f | while read file; do
                if ! head -n 1 "$file" | grep -q "^---$"; then
                  # Determine title
                  rel_path="${file#$lang_dir/}"
                  
                  if [ "$(basename "$file")" = "index.md" ]; then
                    if [ "$rel_path" = "index.md" ]; then
                      title="Admin Panel"
                    else
                      # Section index
                      dir_name=$(basename $(dirname "$file"))
                      case "$dir_name" in
                        "users"|"usuarios") title="Users" ;;
                        "devices"|"dispositivos") title="Devices" ;;
                        "settings"|"configuracion"|"ajustes") title="Settings" ;;
                        "plans"|"planes") title="Plans" ;;
                        *) title=$(echo "$dir_name" | sed 's/-/ /g' | sed 's/\b\w/\U&/g') ;;
                      esac
                    fi
                  else
                    # Regular page
                    title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
                  fi
                  
                  # Add front matter
                  cat > temp_file.md << EOF
          ---
          layout: default
          title: "$title"
          language: "$lang"
          language_name: "$lang_name"
          ---
          
          EOF
                  cat "$file" >> temp_file.md
                  mv temp_file.md "$file"
                fi
              done
            fi
          done

      - name: Create data files
        run: |
          mkdir -p _site_source/_data
          
          # Create languages.yml
          cat > _site_source/_data/languages.yml << 'EOF'
          - code: "en"
            name: "English"
          - code: "es"
            name: "Español"
          EOF

      - name: Create Jekyll layout
        run: |
          mkdir -p _site_source/_layouts
          cat > _site_source/_layouts/default.html << 'EOF'
          <!DOCTYPE html>
          <html lang="{{ page.language | default: 'en' }}">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>{{ page.title }} - Admin Panel Documentation</title>
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
                      line-height: 1.6;
                      color: #333;
                      background-color: #f8f9fa;
                  }
                  
                  .container {
                      display: flex;
                      min-height: 100vh;
                  }
                  
                  .sidebar {
                      width: 280px;
                      background: white;
                      border-right: 1px solid #e1e4e8;
                      padding: 20px 0;
                      overflow-y: auto;
                      position: fixed;
                      height: 100vh;
                  }
                  
                  .sidebar-header {
                      padding: 0 20px 15px;
                      border-bottom: 1px solid #e1e4e8;
                      margin-bottom: 15px;
                  }
                  
                  .sidebar h3 {
                      font-size: 18px;
                      color: #24292e;
                      margin-bottom: 10px;
                  }
                  
                  .language-selector {
                      position: relative;
                      margin-bottom: 10px;
                  }
                  
                  .language-dropdown {
                      width: 100%;
                      padding: 8px 12px;
                      border: 1px solid #e1e4e8;
                      border-radius: 4px;
                      background: white;
                      font-size: 14px;
                      cursor: pointer;
                  }
                  
                  .language-dropdown:hover {
                      border-color: #0366d6;
                  }
                  
                  .nav-section {
                      margin-bottom: 20px;
                  }
                  
                  .nav-section-title {
                      padding: 8px 20px;
                      font-weight: 600;
                      color: #586069;
                      cursor: pointer;
                      background: #f6f8fa;
                      border-left: 3px solid transparent;
                      text-decoration: none;
                      display: block;
                  }
                  
                  .nav-section-title:hover {
                      background: #e1e4e8;
                      color: #586069;
                  }
                  
                  .nav-section-title.active {
                      background: #0366d6;
                      color: white;
                      border-left-color: #0366d6;
                  }
                  
                  .nav-items {
                      display: none;
                      padding-left: 15px;
                  }
                  
                  .nav-items.show {
                      display: block;
                  }
                  
                  .nav-items a {
                      display: block;
                      padding: 6px 20px;
                      color: #586069;
                      text-decoration: none;
                      font-size: 14px;
                      border-left: 3px solid transparent;
                  }
                  
                  .nav-items a:hover {
                      color: #0366d6;
                      background: #f6f8fa;
                  }
                  
                  .nav-items a.active {
                      color: #0366d6;
                      background: #f6f8fa;
                      border-left-color: #0366d6;
                      font-weight: 500;
                  }
                  
                  .content {
                      flex: 1;
                      margin-left: 280px;
                      padding: 40px;
                      background: white;
                      min-height: 100vh;
                  }
                  
                  .content h1 {
                      font-size: 32px;
                      margin-bottom: 16px;
                      color: #24292e;
                      border-bottom: 1px solid #e1e4e8;
                      padding-bottom: 10px;
                  }
                  
                  .content h2 {
                      font-size: 24px;
                      margin: 32px 0 16px;
                      color: #24292e;
                  }
                  
                  .content h3 {
                      font-size: 20px;
                      margin: 24px 0 12px;
                      color: #24292e;
                  }
                  
                  .content p {
                      margin-bottom: 16px;
                      color: #586069;
                  }
                  
                  .content blockquote {
                      margin: 16px 0;
                      padding: 16px;
                      background: #f6f8fa;
                      border-left: 4px solid #0366d6;
                      border-radius: 4px;
                  }
                  
                  .content blockquote p {
                      margin: 0;
                  }
                  
                  .content ul, .content ol {
                      margin-bottom: 16px;
                      padding-left: 24px;
                  }
                  
                  .content li {
                      margin-bottom: 4px;
                  }
                  
                  .content code {
                      background: #f6f8fa;
                      padding: 2px 6px;
                      border-radius: 3px;
                      font-size: 14px;
                      font-family: 'SF Mono', Monaco, monospace;
                  }
                  
                  .content pre {
                      background: #f6f8fa;
                      padding: 16px;
                      border-radius: 6px;
                      overflow-x: auto;
                      margin-bottom: 16px;
                  }
                  
                  .content pre code {
                      background: none;
                      padding: 0;
                  }
                  
                  @media (max-width: 768px) {
                      .sidebar {
                          transform: translateX(-100%);
                          transition: transform 0.3s;
                      }
                      
                      .content {
                          margin-left: 0;
                      }
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <nav class="sidebar">
                      <div class="sidebar-header">
                          <h3>Admin Panel</h3>
                          <div class="language-selector">
                              <select class="language-dropdown" id="languageSelector">
                                  {% for lang in site.data.languages %}
                                  <option value="{{ lang.code }}" {% if page.language == lang.code %}selected{% endif %}>
                                      {{ lang.name }}
                                  </option>
                                  {% endfor %}
                              </select>
                          </div>
                      </div>
                      
                      <!-- Getting Started section -->
                      <div class="nav-section">
                          <a href="{{ site.baseurl }}/{{ page.language }}/index.html" class="nav-section-title" data-section="getting-started">Getting Started</a>
                          <div class="nav-items" id="getting-started">
                              <a href="{{ site.baseurl }}/{{ page.language }}/access.html">Access</a>
                          </div>
                      </div>
                      
                      <!-- Users section -->
                      <div class="nav-section">
                          {% if page.language == 'es' %}
                          <a href="{{ site.baseurl }}/{{ page.language }}/usuarios/index.html" class="nav-section-title" data-section="usuarios">Users</a>
                          <div class="nav-items" id="usuarios">
                              <a href="{{ site.baseurl }}/{{ page.language }}/usuarios/crear-usuario.html">Create User</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/usuarios/eliminar-usuario.html">Delete User</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/usuarios/detalles-del-usuario.html">User Details</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/usuarios/operaciones-de-facturacin.html">Billing Operations</a>
                          </div>
                          {% else %}
                          <a href="{{ site.baseurl }}/{{ page.language }}/users/index.html" class="nav-section-title" data-section="users">Users</a>
                          <div class="nav-items" id="users">
                              <a href="{{ site.baseurl }}/{{ page.language }}/users/billing-operations.html">Billing Operations</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/users/create-user.html">Create User</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/users/delete-user.html">Delete User</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/users/user-details.html">User Details</a>
                          </div>
                          {% endif %}
                      </div>
                      
                      <!-- Devices section -->
                      <div class="nav-section">
                          {% if page.language == 'es' %}
                          <a href="{{ site.baseurl }}/{{ page.language }}/dispositivos/index.html" class="nav-section-title" data-section="dispositivos">Devices</a>
                          <div class="nav-items" id="dispositivos">
                              <a href="{{ site.baseurl }}/{{ page.language }}/dispositivos/air-console.html">Air Console</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/dispositivos/operaciones-bsicas.html">Basic Operations</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/dispositivos/activacin-masiva.html">Bulk Activation</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/dispositivos/clones-de-rastreadores.html">Tracker Clones</a>
                          </div>
                          {% else %}
                          <a href="{{ site.baseurl }}/{{ page.language }}/devices/index.html" class="nav-section-title" data-section="devices">Devices</a>
                          <div class="nav-items" id="devices">
                              <a href="{{ site.baseurl }}/{{ page.language }}/devices/air-console.html">Air Console</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/devices/basic-operations.html">Basic Operations</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/devices/bulk-activation.html">Bulk Activation</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/devices/change-plan.html">Change Plan</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/devices/tracker-clones.html">Tracker Clones</a>
                          </div>
                          {% endif %}
                      </div>
                      
                      <!-- Settings section -->
                      <div class="nav-section">
                          <a href="{{ site.baseurl }}/{{ page.language }}/settings/index.html" class="nav-section-title" data-section="settings">Settings</a>
                          <div class="nav-items" id="settings">
                              <a href="{{ site.baseurl }}/{{ page.language }}/settings/branding-options.html">Branding Options</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/settings/custom-menu-editor.html">Custom Menu Editor</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/settings/domain-name.html">Domain Name</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/settings/payment-gateway.html">Payment Gateway</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/settings/two-factor-authentication.html">Two Factor Authentication</a>
                          </div>
                      </div>
                      
                      <!-- Plans section -->
                      <div class="nav-section">
                          <a href="{{ site.baseurl }}/{{ page.language }}/plans/index.html" class="nav-section-title" data-section="plans">Plans</a>
                          <div class="nav-items" id="plans">
                              <a href="{{ site.baseurl }}/{{ page.language }}/plans/activation-codes.html">Activation Codes</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/plans/assets-are-not-displayed-in-the-account.html">Assets Are Not Displayed</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/plans/pricing-plans-conflicts.html">Pricing Plans Conflicts</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/plans/suspending-service-for-a-device.html">Suspending Service</a>
                          </div>
                      </div>
                      
                      <!-- Other section -->
                      <div class="nav-section">
                          <div class="nav-section-title" data-section="other">Other</div>
                          <div class="nav-items" id="other">
                              <a href="{{ site.baseurl }}/{{ page.language }}/reports.html">Reports</a>
                              <a href="{{ site.baseurl }}/{{ page.language }}/resellers.html">Resellers</a>
                          </div>
                      </div>
                  </nav>
                  
                  <main class="content">
                      {{ content }}
                  </main>
              </div>
              
              <script>
                  document.addEventListener('DOMContentLoaded', function() {
                      const sectionTitles = document.querySelectorAll('.nav-section-title');
                      const currentPath = window.location.pathname;
                      const languageSelector = document.getElementById('languageSelector');
                      const baseUrl = '{{ site.baseurl }}' || '';
                      
                      // Handle language selector change
                      if (languageSelector) {
                          languageSelector.addEventListener('change', function() {
                              const newLang = this.value;
                              const currentLang = '{{ page.language }}';
                              
                              // Extract the page path after language
                              let pathAfterLang = currentPath;
                              if (pathAfterLang.includes('/' + currentLang + '/')) {
                                  pathAfterLang = pathAfterLang.split('/' + currentLang + '/')[1] || 'index.html';
                              }
                              
                              // Simple mapping for different folder structures
                              if (currentLang === 'en' && newLang === 'es') {
                                  pathAfterLang = pathAfterLang.replace('users/', 'usuarios/');
                                  pathAfterLang = pathAfterLang.replace('devices/', 'dispositivos/');
                              } else if (currentLang === 'es' && newLang === 'en') {
                                  pathAfterLang = pathAfterLang.replace('usuarios/', 'users/');
                                  pathAfterLang = pathAfterLang.replace('dispositivos/', 'devices/');
                              }
                              
                              // Construct new URL
                              const newPath = baseUrl + '/' + newLang + '/' + pathAfterLang;
                              window.location.href = newPath;
                          });
                      }
                      
                      // Handle section title clicks
                      sectionTitles.forEach(title => {
                          const sectionId = title.getAttribute('data-section');
                          const section = document.getElementById(sectionId);
                          
                          if (section && !title.href) {
                              title.addEventListener('click', function(e) {
                                  e.preventDefault();
                                  toggleSection(sectionId);
                              });
                          }
                      });
                      
                      // Auto-open section and highlight current page
                      let sectionToOpen = null;
                      
                      if (currentPath.includes('/users/') || currentPath.includes('/usuarios/')) sectionToOpen = '{{ page.language }}' === 'es' ? 'usuarios' : 'users';
                      else if (currentPath.includes('/devices/') || currentPath.includes('/dispositivos/')) sectionToOpen = '{{ page.language }}' === 'es' ? 'dispositivos' : 'devices';
                      else if (currentPath.includes('/settings/')) sectionToOpen = 'settings';
                      else if (currentPath.includes('/plans/')) sectionToOpen = 'plans';
                      else if (currentPath.includes('/reports') || currentPath.includes('/resellers')) sectionToOpen = 'other';
                      else sectionToOpen = 'getting-started';
                      
                      if (sectionToOpen && document.getElementById(sectionToOpen)) {
                          openSection(sectionToOpen);
                          
                          // Highlight current page
                          document.querySelectorAll('.nav-items a, .nav-section-title').forEach(link => {
                              const linkHref = link.getAttribute('href');
                              if (linkHref && currentPath.endsWith(linkHref.split('/').pop())) {
                                  link.classList.add('active');
                              }
                          });
                      }
                  });
                  
                  function toggleSection(sectionId) {
                      const section = document.getElementById(sectionId);
                      const title = document.querySelector(`[data-section="${sectionId}"]`);
                      
                      if (section && section.classList.contains('show')) {
                          section.classList.remove('show');
                          if (title) title.classList.remove('active');
                      } else if (section) {
                          // Close other sections
                          document.querySelectorAll('.nav-items').forEach(item => {
                              item.classList.remove('show');
                          });
                          document.querySelectorAll('.nav-section-title').forEach(item => {
                              item.classList.remove('active');
                          });
                          
                          // Open current section
                          section.classList.add('show');
                          if (title) title.classList.add('active');
                      }
                  }
                  
                  function openSection(sectionId) {
                      const section = document.getElementById(sectionId);
                      const title = document.querySelector(`[data-section="${sectionId}"]`);
                      
                      if (section && title) {
                          section.classList.add('show');
                          title.classList.add('active');
                      }
                  }
              </script>
          </body>
          </html>
          EOF

      - name: Create Jekyll configuration
        run: |
          cat > _site_source/_config.yml << 'EOF'
          title: "Admin Panel Documentation"
          description: "Navixy Admin Panel Administration Guide"
          baseurl: "/udoc"
          url: "https://amasyunin.github.io"
          
          markdown: kramdown
          highlighter: rouge
          
          kramdown:
            input: GFM
            syntax_highlighter: rouge
          
          exclude:
            - SUMMARY.md
            - Gemfile
            - Gemfile.lock
            - node_modules/
            - vendor/
            - README.md
          
          plugins:
            - jekyll-seo-tag
          
          defaults:
            - scope:
                path: ""
              values:
                layout: "default"
          EOF

      - name: Create root index redirect
        run: |
          cat > _site_source/index.html << 'EOF'
          ---
          ---
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url={{ site.baseurl }}/en/">
              <link rel="canonical" href="{{ site.baseurl }}/en/" />
              <title>Redirecting to Admin Panel Documentation</title>
          </head>
          <body>
              <h1>Admin Panel Documentation</h1>
              <p>Redirecting to <a href="{{ site.baseurl }}/en/">English documentation</a>...</p>
              <script>
                  window.location.href = "{{ site.baseurl }}/en/";
              </script>
          </body>
          </html>
          EOF

      - name: Ensure index files exist
        run: |
          # Create missing index files
          for lang_dir in _site_source/*/; do
            if [ -d "$lang_dir" ]; then
              lang=$(basename "$lang_dir")
              
              # Root index
              if [ ! -f "$lang_dir/index.md" ]; then
                echo "Creating root index for $lang"
                case "$lang" in
                  "en") lang_name="English" ;;
                  "es") lang_name="Español" ;;
                  *) lang_name="$lang" ;;
                esac
                
                cat > "$lang_dir/index.md" << EOF
          ---
          layout: default
          title: "Admin Panel"
          language: "$lang"
          language_name: "$lang_name"
          ---
          
          # Admin Panel Documentation
          
          Welcome to the Admin Panel documentation.
          
          Use the navigation on the left to browse through the available sections.
          EOF
              fi
              
              # Section index files
              for section_dir in "$lang_dir"*/; do
                if [ -d "$section_dir" ] && [ "$(basename "$section_dir")" != "attachments" ]; then
                  if [ ! -f "$section_dir/index.md" ]; then
                    section_name=$(basename "$section_dir")
                    echo "Creating section index for $lang/$section_name"
                    
                    case "$section_name" in
                      "users"|"usuarios") title="Users" ;;
                      "devices"|"dispositivos") title="Devices" ;;
                      "settings"|"configuracion") title="Settings" ;;
                      "plans"|"planes") title="Plans" ;;
                      *) title=$(echo "$section_name" | sed 's/-/ /g' | sed 's/\b\w/\U&/g') ;;
                    esac
                    
                    case "$lang" in
                      "en") lang_name="English" ;;
                      "es") lang_name="Español" ;;
                      *) lang_name="$lang" ;;
                    esac
                    
                    cat > "$section_dir/index.md" << EOF
          ---
          layout: default
          title: "$title"
          language: "$lang"
          language_name: "$lang_name"
          ---
          
          # $title
          
          This section contains documentation for $title management.
          EOF
                  fi
                fi
              done
            fi
          done

      - name: Debug final structure
        run: |
          echo "=== Generated structure ==="
          find _site_source -name "*.md" | sort
          
          echo ""
          echo "=== Language files check ==="
          for lang in en es; do
            echo "=== $lang ==="
            if [ -f "_site_source/$lang/index.md" ]; then
              echo "✅ $lang/index.md exists"
            else
              echo "❌ $lang/index.md missing"
            fi
            
            for section in users usuarios devices dispositivos settings plans; do
              if [ -f "_site_source/$lang/$section/index.md" ]; then
                echo "✅ $lang/$section/index.md exists"
              elif [ -d "_site_source/$lang/$section" ]; then
                echo "❌ $lang/$section/index.md missing (dir exists)"
              fi
            done
          done

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_source
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
