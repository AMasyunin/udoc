name: Deploy Admin Panel Docs

on:
  push:
    branches: [ main, master, userdocs ]
    paths: [ 'docs/admin-panel/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare content and analyze structure
        run: |
          # Create site directory
          mkdir -p _site_source
          
          # Copy admin-panel content
          cp -r docs/admin-panel/* _site_source/
          
          # Analyze the actual structure
          echo "=== ANALYZING REPOSITORY STRUCTURE ==="
          find _site_source -name "*.md" | sort
          echo "=== END STRUCTURE ANALYSIS ==="
          
          # Rename README.md to index.md for Jekyll
          if [ -f _site_source/README.md ]; then
            mv _site_source/README.md _site_source/index.md
          fi
          
          # Fix GitBook syntax
          find _site_source -name "*.md" -type f -exec sed -i 's/{% hint style="[^"]*" %}/> **Note:** /g' {} \;
          find _site_source -name "*.md" -type f -exec sed -i 's/{% endhint %}/\n/g' {} \;
          find _site_source -name "*.md" -type f -exec sed -i 's/{% hint %}/> **Note:** /g' {} \;
          find _site_source -name "*.md" -type f -exec sed -i 's/{% page-ref page="[^"]*" %}/\[See related page\]/g' {} \;

      - name: Generate simple navigation
        run: |
          # Create a simple script to generate TOC from the main page
          cat > generate_nav.py << 'EOF'
          import os
          import re
          
          def extract_headings(filepath):
              """Extract headings from markdown file to create TOC"""
              try:
                  with open(filepath, 'r', encoding='utf-8') as f:
                      content = f.read()
                      
                  # Find all headings
                  headings = []
                  for match in re.finditer(r'^(#{2,4})\s+(.+)

      - name: Create Jekyll config and layout
        run: |
          cat > _site_source/_config.yml << 'EOF'
          title: "Admin Panel Documentation"
          description: "Administration Guide"
          baseurl: "/udoc"
          url: "https://amasyunin.github.io"
          
          markdown: kramdown
          kramdown:
            input: GFM
            syntax_highlighter: rouge
          
          highlighter: rouge
          
          plugins:
            - jekyll-sitemap
          
          include:
            - README.md
            - "*.md"
          
          exclude:
            - .gitbook*
            - book.json
            - node_modules/
            - "*.log"
            - Gemfile
            - Gemfile.lock
            - generate_nav.py
            - SUMMARY.md
          EOF
          
          # Create layouts directory
          mkdir -p _site_source/_layouts
          
          # Create simple, working layout
          cat > _site_source/_layouts/default.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      line-height: 1.6;
                      color: #24292e;
                      background: #ffffff;
                      display: flex;
                      min-height: 100vh;
                  }
                  
                  .sidebar {
                      width: 280px;
                      background: #f6f8fa;
                      border-right: 1px solid #e1e4e8;
                      padding: 20px;
                      overflow-y: auto;
                      flex-shrink: 0;
                  }
                  
                  .sidebar h2 {
                      font-size: 16px;
                      margin-bottom: 20px;
                      color: #24292e;
                      border-bottom: 1px solid #e1e4e8;
                      padding-bottom: 8px;
                  }
                  
                  .sidebar ul {
                      list-style: none;
                  }
                  
                  .sidebar li {
                      margin-bottom: 6px;
                  }
                  
                  .sidebar a {
                      display: block;
                      padding: 8px 12px;
                      color: #586069;
                      text-decoration: none;
                      border-radius: 6px;
                      font-size: 14px;
                      transition: all 0.2s;
                  }
                  
                  .sidebar a:hover {
                      background-color: #e1e4e8;
                      color: #24292e;
                  }
                  
                  .sidebar a.current {
                      background-color: #0366d6;
                      color: white;
                  }
                  
                  .sidebar .toc-level-1 {
                      font-weight: 500;
                  }
                  
                  .sidebar .toc-level-2 {
                      padding-left: 24px;
                      font-size: 13px;
                  }
                  
                  .sidebar .toc-level-3 {
                      padding-left: 36px;
                      font-size: 12px;
                      color: #6a737d;
                  }
                  
                  .content {
                      flex: 1;
                      padding: 40px;
                      overflow-y: auto;
                  }
                  
                  .content h1 {
                      font-size: 32px;
                      margin-bottom: 20px;
                      border-bottom: 1px solid #e1e4e8;
                      padding-bottom: 10px;
                  }
                  
                  .content h2 {
                      font-size: 24px;
                      margin-top: 32px;
                      margin-bottom: 16px;
                  }
                  
                  .content h3 {
                      font-size: 20px;
                      margin-top: 24px;
                      margin-bottom: 12px;
                  }
                  
                  .content p {
                      margin-bottom: 16px;
                  }
                  
                  .content ul, .content ol {
                      margin-bottom: 16px;
                      padding-left: 20px;
                  }
                  
                  .content li {
                      margin-bottom: 4px;
                  }
                  
                  .content code {
                      background: #f6f8fa;
                      padding: 2px 6px;
                      border-radius: 3px;
                      font-family: 'SFMono-Regular', Consolas, monospace;
                      font-size: 0.9em;
                  }
                  
                  .content pre {
                      background: #f6f8fa;
                      padding: 16px;
                      border-radius: 6px;
                      overflow-x: auto;
                      margin-bottom: 16px;
                      border: 1px solid #e1e4e8;
                  }
                  
                  .content pre code {
                      background: none;
                      padding: 0;
                  }
                  
                  .content blockquote {
                      border-left: 4px solid #0366d6;
                      background: #f6f8fa;
                      padding: 16px;
                      margin: 16px 0;
                      border-radius: 0 6px 6px 0;
                  }
                  
                  .content blockquote p {
                      margin-bottom: 8px;
                  }
                  
                  .content blockquote p:last-child {
                      margin-bottom: 0;
                  }
                  
                  .content table {
                      width: 100%;
                      border-collapse: collapse;
                      margin-bottom: 16px;
                  }
                  
                  .content th, .content td {
                      border: 1px solid #e1e4e8;
                      padding: 8px 12px;
                      text-align: left;
                  }
                  
                  .content th {
                      background: #f6f8fa;
                      font-weight: 600;
                  }
                  
                  .content img {
                      max-width: 100%;
                      height: auto;
                      margin: 16px 0;
                      border-radius: 6px;
                  }
                  
                  .content a {
                      color: #0366d6;
                      text-decoration: none;
                  }
                  
                  .content a:hover {
                      text-decoration: underline;
                  }
                  
                  /* Responsive */
                  @media (max-width: 768px) {
                      body {
                          flex-direction: column;
                      }
                      
                      .sidebar {
                          width: 100%;
                          border-right: none;
                          border-bottom: 1px solid #e1e4e8;
                      }
                      
                      .content {
                          padding: 20px;
                      }
                  }
              </style>
          </head>
          <body>
              <nav class="sidebar">
                  <h2>{{ site.title }}</h2>
                  <ul>
                      {% include _navigation.html %}
                  </ul>
              </nav>
              
              <main class="content">
                  {{ content }}
              </main>
          </body>
          </html>
          EOF

      - name: Create Gemfile
        run: |
          cat > _site_source/Gemfile << 'EOF'
          source 'https://rubygems.org'
          
          gem 'jekyll', '~> 4.3.0'
          gem 'jekyll-sitemap'
          gem 'webrick'
          EOF

      - name: Build with Jekyll
        run: |
          cd _site_source
          bundle install
          bundle exec jekyll build --destination ../_site --verbose

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4, content, re.MULTILINE):
