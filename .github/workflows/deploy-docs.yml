name: Deploy Multi-Language Admin Panel Docs

on:
  push:
    branches: [ main, master, userdocs ]
    paths: [ 'docs/admin-panel**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Detect and normalize language structures
        id: detect-languages
        run: |
          # Create site directory
          mkdir -p _site_source
          
          # Detect all admin-panel folders and extract language codes
          languages=""
          language_names=""
          
          # Create navigation structure file
          nav_file="_site_source/_data/navigation.yml"
          mkdir -p _site_source/_data
          echo "# Navigation structure for each language" > $nav_file
          
          for dir in docs/admin-panel*; do
            if [ -d "$dir" ]; then
              basename_dir=$(basename "$dir")
              if [ "$basename_dir" = "admin-panel" ]; then
                # Default English
                lang_code="en"
                lang_name="English"
              else
                # Extract locale from admin-panel-{locale}
                lang_code="${basename_dir#admin-panel-}"
                case "$lang_code" in
                  "es") lang_name="Español" ;;
                  "ru") lang_name="Русский" ;;
                  "fr") lang_name="Français" ;;
                  "de") lang_name="Deutsch" ;;
                  "it") lang_name="Italiano" ;;
                  "pt") lang_name="Português" ;;
                  *) lang_name="$(echo ${lang_code} | tr '[:lower:]' '[:upper:]')" ;;
                esac
              fi
              
              echo "Found language: $lang_code ($lang_name) in $dir"
              
              if [ -z "$languages" ]; then
                languages="$lang_code"
                language_names="$lang_name"
              else
                languages="$languages,$lang_code"
                language_names="$language_names,$lang_name"
              fi
              
              # Determine the actual content directory
              content_dir="$dir"
              if [ -d "$dir/admin-panel" ] && [ "$lang_code" != "en" ]; then
                content_dir="$dir/admin-panel"
                echo "Using nested admin-panel structure for $lang_code"
              fi
              
              # Scan directory structure for this language
              echo "" >> $nav_file
              echo "$lang_code:" >> $nav_file
              echo "  language_name: \"$lang_name\"" >> $nav_file
              echo "  sections:" >> $nav_file
              
              # Look for main directories (skip files and attachments)
              for subdir in "$content_dir"/*; do
                if [ -d "$subdir" ]; then
                  subdir_name=$(basename "$subdir")
                  
                  # Skip attachment directories
                  if [ "$subdir_name" != "attachments" ]; then
                    echo "    - folder: \"$subdir_name\"" >> $nav_file
                    
                    # Determine section title based on folder name
                    case "$subdir_name" in
                      "users"|"usuarios") echo "      title: \"Users\"" >> $nav_file ;;
                      "devices"|"dispositivos") echo "      title: \"Devices\"" >> $nav_file ;;
                      "settings"|"configuracion"|"ajustes") echo "      title: \"Settings\"" >> $nav_file ;;
                      "plans"|"planes") echo "      title: \"Plans\"" >> $nav_file ;;
                      *) 
                        # Capitalize first letter and convert hyphens to spaces
                        title=$(echo "$subdir_name" | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
                        echo "      title: \"$title\"" >> $nav_file
                        ;;
                    esac
                    
                    # List files in this directory
                    echo "      pages:" >> $nav_file
                    for file in "$subdir"/*.md; do
                      if [ -f "$file" ]; then
                        filename=$(basename "$file" .md)
                        if [ "$filename" != "README" ]; then
                          # Generate page title from filename
                          page_title=$(echo "$filename" | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
                          echo "        - file: \"$filename.html\"" >> $nav_file
                          echo "          title: \"$page_title\"" >> $nav_file
                        fi
                      fi
                    done
                  fi
                fi
              done
              
              # Add root-level files
              echo "  root_pages:" >> $nav_file
              for file in "$content_dir"/*.md; do
                if [ -f "$file" ]; then
                  filename=$(basename "$file" .md)
                  if [ "$filename" != "README" ] && [ "$filename" != "admin-panel-es" ]; then
                    page_title=$(echo "$filename" | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
                    echo "    - file: \"$filename.html\"" >> $nav_file
                    echo "      title: \"$page_title\"" >> $nav_file
                  fi
                fi
              done
            fi
          done
          
          echo "languages=$languages" >> $GITHUB_OUTPUT
          echo "language_names=$language_names" >> $GITHUB_OUTPUT
          echo "Detected languages: $languages"
          echo "Language names: $language_names"
          
          echo "Generated navigation structure:"
          cat $nav_file

      - name: Process each language with structure normalization
        env:
          LANGUAGES: ${{ steps.detect-languages.outputs.languages }}
          LANGUAGE_NAMES: ${{ steps.detect-languages.outputs.language_names }}
        run: |
          IFS=',' read -ra LANG_CODES <<< "$LANGUAGES"
          IFS=',' read -ra LANG_NAMES <<< "$LANGUAGE_NAMES"
          
          for i in "${!LANG_CODES[@]}"; do
            lang_code="${LANG_CODES[$i]}"
            lang_name="${LANG_NAMES[$i]}"
            
            echo "Processing language: $lang_code ($lang_name)"
            
            # Determine source directory
            if [ "$lang_code" = "en" ]; then
              source_dir="docs/admin-panel"
            else
              source_dir="docs/admin-panel-$lang_code"
            fi
            
            # Create language-specific directory
            lang_dir="_site_source/$lang_code"
            mkdir -p "$lang_dir"
            
            # Handle nested admin-panel structure for non-English languages
            if [ "$lang_code" != "en" ] && [ -d "$source_dir/admin-panel" ]; then
              echo "Copying from nested structure: $source_dir/admin-panel -> $lang_dir"
              cp -r "$source_dir/admin-panel"/* "$lang_dir/"
            else
              echo "Copying from direct structure: $source_dir -> $lang_dir"
              cp -r "$source_dir"/* "$lang_dir/"
            fi
            
            # Debug: Show what was copied
            echo "Files copied to $lang_dir:"
            ls -la "$lang_dir/" | head -10
            
            # Rename all README.md files to index.md
            find "$lang_dir" -name "README.md" -exec sh -c '
              dir=$(dirname "$1")
              mv "$1" "$dir/index.md"
              echo "Renamed $1 to $dir/index.md"
            ' _ {} \;
            
            # Fix GitBook syntax
            find "$lang_dir" -name "*.md" -type f -exec sed -i 's/{% hint style="[^"]*" %}/> **Note:** /g' {} \;
            find "$lang_dir" -name "*.md" -type f -exec sed -i 's/{% endhint %}/\n/g' {} \;
            find "$lang_dir" -name "*.md" -type f -exec sed -i 's/{% hint %}/> **Note:** /g' {} \;
          done

      - name: Add front matter to all pages
        env:
          LANGUAGES: ${{ steps.detect-languages.outputs.languages }}
          LANGUAGE_NAMES: ${{ steps.detect-languages.outputs.language_names }}
        run: |
          IFS=',' read -ra LANG_CODES <<< "$LANGUAGES"
          IFS=',' read -ra LANG_NAMES <<< "$LANGUAGE_NAMES"
          
          for i in "${!LANG_CODES[@]}"; do
            lang_code="${LANG_CODES[$i]}"
            lang_name="${LANG_NAMES[$i]}"
            lang_dir="_site_source/$lang_code"
            
            echo "Adding front matter for $lang_code"
            
            # Root index page - create if missing
            if [ -f "$lang_dir/index.md" ]; then
              cat > temp_index.md << EOF
          ---
          layout: default
          title: "Admin Panel"
          language: "$lang_code"
          language_name: "$lang_name"
          ---
          
          EOF
              tail -n +1 "$lang_dir/index.md" >> temp_index.md
              mv temp_index.md "$lang_dir/index.md"
            else
              # Create default index page if missing
              echo "Creating default index page for $lang_code"
              cat > "$lang_dir/index.md" << EOF
          ---
          layout: default
          title: "Admin Panel"
          language: "$lang_code"
          language_name: "$lang_name"
          ---
          
          # Admin Panel Documentation
          
          Welcome to the Admin Panel documentation.
          
          Use the navigation on the left to browse through the available sections.
          EOF
            fi
            
            # Add front matter to all other markdown files
            find "$lang_dir" -name "*.md" -not -path "$lang_dir/index.md" -type f | while read file; do
              if ! head -n 1 "$file" | grep -q "^---$"; then
                # Determine title based on file type and path
                rel_path="${file#$lang_dir/}"
                
                # Check if it's a directory index file
                if [[ "$rel_path" =~ /index\.md$ ]]; then
                  # Section index files: use directory name
                  dir_name=$(basename $(dirname "$file"))
                  case "$dir_name" in
                    "users"|"usuarios") title="Users" ;;
                    "devices"|"dispositivos") title="Devices" ;;
                    "settings"|"configuracion"|"ajustes") title="Settings" ;;
                    "plans"|"planes") title="Plans" ;;
                    *) title=$(echo "$dir_name" | sed 's/-/ /g' | sed 's/\b\w/\U&/g') ;;
                  esac
                else
                  # Sub-pages: use filename
                  title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
                fi
                
                cat > temp_file.md << EOF
          ---
          layout: default
          title: "$title"
          language: "$lang_code"
          language_name: "$lang_name"
          ---
          
          EOF
                cat "$file" >> temp_file.md
                mv temp_file.md "$file"
              fi
            done
          done

      - name: Create language configuration
        env:
          LANGUAGES: ${{ steps.detect-languages.outputs.languages }}
          LANGUAGE_NAMES: ${{ steps.detect-languages.outputs.language_names }}
        run: |
          # Create languages.yml for Jekyll
          cat > _site_source/_data/languages.yml << 'EOF'
          # Available languages configuration
          EOF
          
          IFS=',' read -ra LANG_CODES <<< "$LANGUAGES"
          IFS=',' read -ra LANG_NAMES <<< "$LANGUAGE_NAMES"
          
          for i in "${!LANG_CODES[@]}"; do
            lang_code="${LANG_CODES[$i]}"
            lang_name="${LANG_NAMES[$i]}"
            
            cat >> _site_source/_data/languages.yml << EOF
          - code: "$lang_code"
            name: "$lang_name"
          EOF
          done
          
          echo "Created languages configuration:"
          cat _site_source/_data/languages.yml

      - name: Create custom Jekyll layout with dynamic navigation
        run: |
          mkdir -p _site_source/_layouts
          cat > _site_source/_layouts/default.html << 'EOF'
          <!DOCTYPE html>
          <html lang="{{ page.language | default: 'en' }}">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>{{ page.title }} - Admin Panel Documentation</title>
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
                      line-height: 1.6;
                      color: #333;
                      background-color: #f8f9fa;
                  }
                  
                  .container {
                      display: flex;
                      min-height: 100vh;
                  }
                  
                  .sidebar {
                      width: 280px;
                      background: white;
                      border-right: 1px solid #e1e4e8;
                      padding: 20px 0;
                      overflow-y: auto;
                      position: fixed;
                      height: 100vh;
                  }
                  
                  .sidebar-header {
                      padding: 0 20px 15px;
                      border-bottom: 1px solid #e1e4e8;
                      margin-bottom: 15px;
                  }
                  
                  .sidebar h3 {
                      font-size: 18px;
                      color: #24292e;
                      margin-bottom: 10px;
                  }
                  
                  .language-selector {
                      position: relative;
                      margin-bottom: 10px;
                  }
                  
                  .language-dropdown {
                      width: 100%;
                      padding: 8px 12px;
                      border: 1px solid #e1e4e8;
                      border-radius: 4px;
                      background: white;
                      font-size: 14px;
                      cursor: pointer;
                  }
                  
                  .language-dropdown:hover {
                      border-color: #0366d6;
                  }
                  
                  .nav-section {
                      margin-bottom: 20px;
                  }
                  
                  .nav-section-title {
                      padding: 8px 20px;
                      font-weight: 600;
                      color: #586069;
                      cursor: pointer;
                      background: #f6f8fa;
                      border-left: 3px solid transparent;
                      text-decoration: none;
                      display: block;
                  }
                  
                  .nav-section-title:hover {
                      background: #e1e4e8;
                      color: #586069;
                  }
                  
                  .nav-section-title.active {
                      background: #0366d6;
                      color: white;
                      border-left-color: #0366d6;
                  }
                  
                  .nav-items {
                      display: none;
                      padding-left: 15px;
                  }
                  
                  .nav-items.show {
                      display: block;
                  }
                  
                  .nav-items a {
                      display: block;
                      padding: 6px 20px;
                      color: #586069;
                      text-decoration: none;
                      font-size: 14px;
                      border-left: 3px solid transparent;
                  }
                  
                  .nav-items a:hover {
                      color: #0366d6;
                      background: #f6f8fa;
                  }
                  
                  .nav-items a.active {
                      color: #0366d6;
                      background: #f6f8fa;
                      border-left-color: #0366d6;
                      font-weight: 500;
                  }
                  
                  .content {
                      flex: 1;
                      margin-left: 280px;
                      padding: 40px;
                      background: white;
                      min-height: 100vh;
                  }
                  
                  .content h1 {
                      font-size: 32px;
                      margin-bottom: 16px;
                      color: #24292e;
                      border-bottom: 1px solid #e1e4e8;
                      padding-bottom: 10px;
                  }
                  
                  .content h2 {
                      font-size: 24px;
                      margin: 32px 0 16px;
                      color: #24292e;
                  }
                  
                  .content h3 {
                      font-size: 20px;
                      margin: 24px 0 12px;
                      color: #24292e;
                  }
                  
                  .content p {
                      margin-bottom: 16px;
                      color: #586069;
                  }
                  
                  .content blockquote {
                      margin: 16px 0;
                      padding: 16px;
                      background: #f6f8fa;
                      border-left: 4px solid #0366d6;
                      border-radius: 4px;
                  }
                  
                  .content blockquote p {
                      margin: 0;
                  }
                  
                  .content ul, .content ol {
                      margin-bottom: 16px;
                      padding-left: 24px;
                  }
                  
                  .content li {
                      margin-bottom: 4px;
                  }
                  
                  .content code {
                      background: #f6f8fa;
                      padding: 2px 6px;
                      border-radius: 3px;
                      font-size: 14px;
                      font-family: 'SF Mono', Monaco, monospace;
                  }
                  
                  .content pre {
                      background: #f6f8fa;
                      padding: 16px;
                      border-radius: 6px;
                      overflow-x: auto;
                      margin-bottom: 16px;
                  }
                  
                  .content pre code {
                      background: none;
                      padding: 0;
                  }
                  
                  @media (max-width: 768px) {
                      .sidebar {
                          transform: translateX(-100%);
                          transition: transform 0.3s;
                      }
                      
                      .content {
                          margin-left: 0;
                      }
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <nav class="sidebar">
                      <div class="sidebar-header">
                          <h3>Admin Panel</h3>
                          <div class="language-selector">
                              <select class="language-dropdown" id="languageSelector">
                                  {% for lang in site.data.languages %}
                                  <option value="{{ lang.code }}" {% if page.language == lang.code %}selected{% endif %}>
                                      {{ lang.name }}
                                  </option>
                                  {% endfor %}
                              </select>
                          </div>
                      </div>
                      
                      <!-- Dynamic navigation based on current language structure -->
                      {% assign current_lang_nav = site.data.navigation[page.language] %}
                      
                      <!-- Getting Started section -->
                      <div class="nav-section">
                          <a href="{{ site.baseurl }}/{{ page.language }}/index.html" class="nav-section-title" data-section="getting-started">Getting Started</a>
                          <div class="nav-items" id="getting-started">
                              {% for root_page in current_lang_nav.root_pages %}
                              <a href="{{ site.baseurl }}/{{ page.language }}/{{ root_page.file }}">{{ root_page.title }}</a>
                              {% endfor %}
                          </div>
                      </div>
                      
                      <!-- Dynamic sections based on detected folder structure -->
                      {% for section in current_lang_nav.sections %}
                      <div class="nav-section">
                          <a href="{{ site.baseurl }}/{{ page.language }}/{{ section.folder }}/index.html" class="nav-section-title" data-section="{{ section.folder }}">{{ section.title }}</a>
                          <div class="nav-items" id="{{ section.folder }}">
                              {% for page_item in section.pages %}
                              <a href="{{ site.baseurl }}/{{ page.language }}/{{ section.folder }}/{{ page_item.file }}">{{ page_item.title }}</a>
                              {% endfor %}
                          </div>
                      </div>
                      {% endfor %}
                  </nav>
                  
                  <main class="content">
                      {{ content }}
                  </main>
              </div>
              
              <script>
                  document.addEventListener('DOMContentLoaded', function() {
                      const sectionTitles = document.querySelectorAll('.nav-section-title');
                      const currentPath = window.location.pathname;
                      const languageSelector = document.getElementById('languageSelector');
                      const baseUrl = '{{ site.baseurl }}' || '';
                      
                      // Handle language selector change
                      if (languageSelector) {
                          languageSelector.addEventListener('change', function() {
                              const newLang = this.value;
                              const currentLang = '{{ page.language }}';
                              
                              // Extract the page path after language
                              let pathAfterLang = currentPath;
                              if (pathAfterLang.includes('/' + currentLang + '/')) {
                                  pathAfterLang = pathAfterLang.split('/' + currentLang + '/')[1] || 'index.html';
                              }
                              
                              // Construct new URL
                              const newPath = baseUrl + '/' + newLang + '/' + pathAfterLang;
                              window.location.href = newPath;
                          });
                      }
                      
                      // Handle section title clicks
                      sectionTitles.forEach(title => {
                          const sectionId = title.getAttribute('data-section');
                          const section = document.getElementById(sectionId);
                          
                          if (section && !title.href) {
                              // Only add click handler if it's not a link
                              title.addEventListener('click', function(e) {
                                  e.preventDefault();
                                  toggleSection(sectionId);
                              });
                          }
                      });
                      
                      // Auto-open section and highlight current page
                      let sectionToOpen = null;
                      
                      // Use path-based detection for section opening
                      const pathParts = currentPath.split('/');
                      if (pathParts.length > 3) {
                          sectionToOpen = pathParts[pathParts.length - 2]; // Get folder name
                      } else {
                          sectionToOpen = 'getting-started';
                      }
                      
                      if (sectionToOpen && document.getElementById(sectionToOpen)) {
                          openSection(sectionToOpen);
                          
                          // Highlight current page
                          document.querySelectorAll('.nav-items a, .nav-section-title').forEach(link => {
                              const linkHref = link.getAttribute('href');
                              if (linkHref && currentPath.endsWith(linkHref.split('/').pop())) {
                                  link.classList.add('active');
                              }
                          });
                      }
                  });
                  
                  function toggleSection(sectionId) {
                      const section = document.getElementById(sectionId);
                      const title = document.querySelector(`[data-section="${sectionId}"]`);
                      
                      if (section.classList.contains('show')) {
                          section.classList.remove('show');
                          title.classList.remove('active');
                      } else {
                          // Close other sections
                          document.querySelectorAll('.nav-items').forEach(item => {
                              item.classList.remove('show');
                          });
                          document.querySelectorAll('.nav-section-title').forEach(item => {
                              item.classList.remove('active');
                          });
                          
                          // Open current section
                          section.classList.add('show');
                          title.classList.add('active');
                      }
                  }
                  
                  function openSection(sectionId) {
                      const section = document.getElementById(sectionId);
                      const title = document.querySelector(`[data-section="${sectionId}"]`);
                      
                      if (section && title) {
                          section.classList.add('show');
                          title.classList.add('active');
                      }
                  }
              </script>
          </body>
          </html>
          EOF

      - name: Create Jekyll configuration
        run: |
          cat > _site_source/_config.yml << 'EOF'
          title: "Admin Panel Documentation"
          description: "Navixy Admin Panel Administration Guide"
          baseurl: "/udoc"
          url: "https://amasyunin.github.io"
          
          markdown: kramdown
          highlighter: rouge
          
          kramdown:
            input: GFM
            syntax_highlighter: rouge
          
          exclude:
            - SUMMARY.md
            - Gemfile
            - Gemfile.lock
            - node_modules/
            - vendor/
            - README.md
          
          plugins:
            - jekyll-seo-tag
          
          # Collections for language handling
          collections_dir: "."
          
          # Language defaults - simplified for debugging
          defaults:
            - scope:
                path: ""
              values:
                layout: "default"
          EOF

      - name: Create root index redirect
        env:
          LANGUAGES: ${{ steps.detect-languages.outputs.languages }}
        run: |
          # Get first language as default (should be 'en')
          IFS=',' read -ra LANG_CODES <<< "$LANGUAGES"
          default_lang="${LANG_CODES[0]}"
          
          cat > _site_source/index.html << EOF
          ---
          ---
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url={{ site.baseurl }}/$default_lang/">
              <link rel="canonical" href="{{ site.baseurl }}/$default_lang/" />
              <title>Redirecting to Admin Panel Documentation</title>
          </head>
          <body>
              <h1>Admin Panel Documentation</h1>
              <p>Redirecting to <a href="{{ site.baseurl }}/$default_lang/">English documentation</a>...</p>
              <script>
                  window.location.href = "{{ site.baseurl }}/$default_lang/";
              </script>
          </body>
          </html>
          EOF

      - name: Debug - Show original source structure
        run: |
          echo "=== English source structure ==="
          if [ -d "docs/admin-panel" ]; then
            echo "English directories:"
            find docs/admin-panel -type d -mindepth 1 -maxdepth 1 | sort
            echo "English files:"
            find docs/admin-panel -name "*.md" -maxdepth 1 | sort
          fi
          echo ""
          echo "=== Spanish source structure ==="
          if [ -d "docs/admin-panel-es" ]; then  
            echo "Spanish top level:"
            ls -la docs/admin-panel-es/
            if [ -d "docs/admin-panel-es/admin-panel" ]; then
              echo "Spanish nested admin-panel directories:"
              find docs/admin-panel-es/admin-panel -type d -mindepth 1 -maxdepth 1 | sort
              echo "Spanish nested admin-panel files:"
              find docs/admin-panel-es/admin-panel -name "*.md" -maxdepth 1 | sort
            fi
          fi
        run: |
          echo "=== Final Navigation Structure ==="
          cat _site_source/_data/navigation.yml
          echo ""
          echo "=== English Structure ==="
          if [ -d "_site_source/en" ]; then
            echo "English root files:"
            ls -la _site_source/en/*.md 2>/dev/null || echo "No English root files"
            echo "English directories:"
            find _site_source/en -type d -mindepth 1 | head -5
            echo "English sample files:"
            find _site_source/en -name "*.md" | head -5
          fi
          echo ""
          echo "=== Spanish Structure ==="
          if [ -d "_site_source/es" ]; then
            echo "Spanish root files:"
            ls -la _site_source/es/*.md 2>/dev/null || echo "No Spanish root files"
            echo "Spanish directories:"
            find _site_source/es -type d -mindepth 1 | head -5
            echo "Spanish sample files:"
            find _site_source/es -name "*.md" | head -5
          fi

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_source
          destination: ./_site

      - name: Debug - Show built structure
        run: |
          echo "=== Built Spanish Files ==="
          if [ -d "_site/es" ]; then
            find _site/es -name "*.html" | head -10
            echo ""
            echo "=== Spanish index.html check ==="
            if [ -f "_site/es/index.html" ]; then
              echo "Spanish index.html EXISTS"
              echo "First few lines:"
              head -5 _site/es/index.html
            else
              echo "Spanish index.html MISSING"
            fi
            echo ""
            echo "=== Spanish usuarios check ==="
            if [ -d "_site/es/usuarios" ]; then
              echo "Spanish usuarios directory EXISTS"
              ls -la _site/es/usuarios/
            else
              echo "Spanish usuarios directory MISSING"
            fi
          else
            echo "Spanish directory completely missing from built site"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
