name: Deploy Admin Panel Docs

on:
  push:
    branches: [ main, master, userdocs ]
    paths: [ 'docs/admin-panel/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare content for Jekyll
        run: |
          # Create site directory
          mkdir -p _site_source
          
          # Copy admin-panel content
          cp -r docs/admin-panel/* _site_source/
          
          echo "=== ORIGINAL STRUCTURE ==="
          find _site_source -name "*.md" | sort
          echo "=== END ORIGINAL STRUCTURE ==="
          
          # Rename all README.md files to index.md for clean URLs
          find _site_source -name "README.md" -exec sh -c '
            dir=$(dirname "$1")
            mv "$1" "$dir/index.md"
            echo "Renamed $1 to $dir/index.md"
          ' _ {} \;
          
          # Fix GitBook syntax
          find _site_source -name "*.md" -type f -exec sed -i 's/{% hint style="[^"]*" %}/> **Note:** /g' {} \;
          find _site_source -name "*.md" -type f -exec sed -i 's/{% endhint %}/\n/g' {} \;
          find _site_source -name "*.md" -type f -exec sed -i 's/{% hint %}/> **Note:** /g' {} \;
          
          # Add front matter to all markdown files
          for file in $(find _site_source -name "*.md" -type f); do
            if ! head -1 "$file" | grep -q "^---"; then
              # Extract title from filename or first heading
              filename=$(basename "$file" .md)
              if [ "$filename" = "index" ]; then
                # For index files, use directory name
                dirname=$(basename $(dirname "$file"))
                if [ "$dirname" = "_site_source" ]; then
                  title="Admin Panel Documentation"
                else
                  title=$(echo "$dirname" | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
                fi
              else
                title=$(echo "$filename" | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
              fi
              
              # Create temp file with front matter
              temp_file="/tmp/temp_$(basename "$file")"
              echo "---" > "$temp_file"
              echo "layout: page" >> "$temp_file"
              echo "title: \"$title\"" >> "$temp_file"
              echo "---" >> "$temp_file"
              echo "" >> "$temp_file"
              cat "$file" >> "$temp_file"
              mv "$temp_file" "$file"
              echo "Added front matter to $file with title: $title"
            fi
          done
          
          echo "=== FINAL STRUCTURE ==="
          find _site_source -name "*.md" | sort
          echo "=== END FINAL STRUCTURE ==="

      - name: Create navigation data
        run: |
          # Create _data directory
          mkdir -p _site_source/_data
          
          # Generate navigation from SUMMARY.md
          python3 -c "
          import os
          import re
          import yaml
          
          def parse_summary():
              nav = {'main': [], 'sections': {}}
              
              try:
                  with open('_site_source/SUMMARY.md', 'r') as f:
                      content = f.read()
                      
                  current_section = None
                  
                  for line in content.split('\n'):
                      line = line.strip()
                      if not line or line.startswith('#'):
                          continue
                      
                      # Count indentation
                      indent = 0
                      original = line
                      while line.startswith('  '):
                          indent += 1
                          line = line[2:]
                      
                      # Parse markdown link
                      match = re.match(r'\* \[(.+?)\]\((.+?)\)', line)
                      if match:
                          title = match.group(1)
                          path = match.group(2)
                          
                          # Convert path to Jekyll URL
                          if path == 'README.md':
                              url = '/'
                          elif path.endswith('/README.md'):
                              url = '/' + path.replace('/README.md', '') + '/'
                          else:
                              url = '/' + path.replace('.md', '.html')
                          
                          item = {'title': title, 'url': url}
                          
                          if indent == 0:
                              if title in ['Users', 'Devices', 'Settings', 'Plans']:
                                  current_section = title
                                  nav['sections'][title] = {'main': item, 'children': []}
                              else:
                                  nav['main'].append(item)
                          elif indent == 1 and current_section:
                              nav['sections'][current_section]['children'].append(item)
              
              except FileNotFoundError:
                  print('SUMMARY.md not found, creating basic structure')
                  nav = {
                      'main': [
                          {'title': 'Admin Panel', 'url': '/'},
                          {'title': 'Access', 'url': '/access.html'}
                      ],
                      'sections': {
                          'Users': {
                              'main': {'title': 'Users', 'url': '/users/'},
                              'children': []
                          }
                      }
                  }
              
              return nav
          
          nav_data = parse_summary()
          
          with open('_site_source/_data/navigation.yml', 'w') as f:
              yaml.dump(nav_data, f, default_flow_style=False, sort_keys=False)
          
          print('=== GENERATED NAVIGATION ===')
          print(yaml.dump(nav_data, default_flow_style=False))
          print('=== END NAVIGATION ===')
          "

      - name: Create Jekyll configuration
        run: |
          cat > _site_source/_config.yml << 'EOF'
          title: "Admin Panel Documentation"
          description: "Administration Guide"  
          baseurl: "/udoc"
          url: "https://amasyunin.github.io"
          
          theme: minima
          
          markdown: kramdown
          highlighter: rouge
          
          plugins:
            - jekyll-feed
            - jekyll-sitemap
          
          # Tell Minima which pages to show in header
          header_pages:
            - index.md
            - access.md
          
          exclude:
            - SUMMARY.md
            - Gemfile
            - Gemfile.lock
          EOF

      - name: Create custom navigation include
        run: |
          mkdir -p _site_source/_includes
          
          # Create a cleaner header with just main sections
          cat > _site_source/_includes/header.html << 'EOF'
          <header class="site-header">
            <div class="wrapper">
              <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
              
              <nav class="site-nav">
                <input type="checkbox" id="nav-trigger" class="nav-trigger" />
                <label for="nav-trigger">
                  <span class="menu-icon">
                    <svg viewBox="0 0 18 15" width="18px" height="15px">
                      <path d="m0,3h18v2h-18z"/>
                      <path d="m0,8h18v2h-18z"/>  
                      <path d="m0,13h18v2h-18z"/>
                    </svg>
                  </span>
                </label>

                <div class="trigger">
                  <!-- Just main navigation -->
                  {% for item in site.data.navigation.main %}
                    <a class="page-link" href="{{ item.url | relative_url }}">{{ item.title }}</a>
                  {% endfor %}
                  
                  <!-- Just section main pages -->
                  {% for section in site.data.navigation.sections %}
                    <a class="page-link" href="{{ section[1].main.url | relative_url }}">{{ section[1].main.title }}</a>
                  {% endfor %}
                </div>
              </nav>
            </div>
          </header>
          EOF
          
          # Create a sidebar navigation for detailed TOC
          cat > _site_source/_includes/sidebar.html << 'EOF'
          <div class="sidebar">
            <div class="sidebar-content">
              <h3>Table of Contents</h3>
              
              <!-- Main pages -->
              {% for item in site.data.navigation.main %}
                <div class="nav-item">
                  <a href="{{ item.url | relative_url }}" 
                     class="nav-link {% if page.url == item.url %}active{% endif %}">
                    {{ item.title }}
                  </a>
                </div>
              {% endfor %}
              
              <!-- Sections with children -->
              {% for section in site.data.navigation.sections %}
                <div class="nav-section">
                  <a href="{{ section[1].main.url | relative_url }}" 
                     class="nav-section-title {% if page.url contains section[1].main.url %}active{% endif %}">
                    {{ section[1].main.title }}
                  </a>
                  
                  {% if section[1].children.size > 0 %}
                    <ul class="nav-children">
                      {% for child in section[1].children %}
                        <li>
                          <a href="{{ child.url | relative_url }}"
                             class="nav-child-link {% if page.url == child.url %}active{% endif %}">
                            {{ child.title }}
                          </a>
                        </li>
                      {% endfor %}
                    </ul>
                  {% endif %}
                </div>
              {% endfor %}
            </div>
          </div>
          EOF

      - name: Create custom layout with sidebar
        run: |
          mkdir -p _site_source/_layouts
          
          cat > _site_source/_layouts/default.html << 'EOF'
          <!DOCTYPE html>
          <html lang="{{ page.lang | default: site.lang | default: "en" }}">

            {%- include head.html -%}

            <body>

              {%- include header.html -%}

              <div class="page-wrapper">
                {%- include sidebar.html -%}
                
                <main class="page-content" aria-label="Content">
                  <div class="wrapper">
                    {{ content }}
                  </div>
                </main>
              </div>

              {%- include footer.html -%}

            </body>

          </html>
          EOF

      - name: Add sidebar CSS
        run: |
          mkdir -p _site_source/assets/css
          
          cat > _site_source/assets/css/main.scss << 'EOF'
          ---
          ---
          @import "{{ site.theme }}";
          
          .page-wrapper {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
          }
          
          .sidebar {
            width: 280px;
            flex-shrink: 0;
            background: #f8f9fa;
            border-right: 1px solid #e1e4e8;
            height: calc(100vh - 160px);
            overflow-y: auto;
            position: sticky;
            top: 20px;
          }
          
          .sidebar-content {
            padding: 20px;
          }
          
          .sidebar h3 {
            margin-bottom: 20px;
            font-size: 16px;
            color: #24292e;
            border-bottom: 1px solid #e1e4e8;
            padding-bottom: 8px;
          }
          
          .nav-item {
            margin-bottom: 8px;
          }
          
          .nav-link {
            display: block;
            padding: 8px 12px;
            color: #586069;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
          }
          
          .nav-link:hover,
          .nav-link.active {
            background-color: #0366d6;
            color: white;
          }
          
          .nav-section {
            margin-bottom: 16px;
          }
          
          .nav-section-title {
            display: block;
            padding: 8px 12px;
            font-weight: 600;
            color: #24292e;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s;
          }
          
          .nav-section-title:hover,
          .nav-section-title.active {
            background-color: #f1f8ff;
            color: #0366d6;
          }
          
          .nav-children {
            list-style: none;
            padding: 0;
            margin: 8px 0 0 0;
          }
          
          .nav-children li {
            margin-bottom: 4px;
          }
          
          .nav-child-link {
            display: block;
            padding: 6px 12px 6px 24px;
            color: #6a737d;
            text-decoration: none;
            font-size: 13px;
            border-radius: 6px;
            transition: all 0.2s;
          }
          
          .nav-child-link:hover,
          .nav-child-link.active {
            background-color: #f1f8ff;
            color: #0366d6;
          }
          
          .page-content {
            flex: 1;
            min-width: 0;
            padding-left: 40px;
          }
          
          @media (max-width: 768px) {
            .page-wrapper {
              flex-direction: column;
            }
            
            .sidebar {
              width: 100%;
              height: auto;
              position: static;
              border-right: none;
              border-bottom: 1px solid #e1e4e8;
            }
            
            .page-content {
              padding-left: 0;
              padding-top: 20px;
            }
          }
          EOF

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_source
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
