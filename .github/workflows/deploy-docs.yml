name: Deploy Admin Panel Docs

on:
  push:
    branches: [ main, master, userdocs ]
    paths: [ 'docs/admin-panel/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare content
        run: |
          mkdir -p _site_source
          cp -r docs/admin-panel/* _site_source/
          
          echo "=== ANALYZING REPOSITORY STRUCTURE ==="
          find _site_source -name "*.md" | sort
          echo "=== END STRUCTURE ANALYSIS ==="
          
          if [ -f _site_source/README.md ]; then
            mv _site_source/README.md _site_source/index.md
            echo "Renamed README.md to index.md"
          fi
          
          # Fix GitBook syntax and add front matter to all markdown files
          find _site_source -name "*.md" -type f -exec sed -i 's/{% hint style="[^"]*" %}/> **Note:** /g' {} \;
          find _site_source -name "*.md" -type f -exec sed -i 's/{% endhint %}/\n/g' {} \;
          find _site_source -name "*.md" -type f -exec sed -i 's/{% hint %}/> **Note:** /g' {} \;
          
          # Add front matter to markdown files that don't have it
          for file in _site_source/*.md _site_source/*/*.md _site_source/*/*/*.md; do
            if [ -f "$file" ]; then
              if ! head -1 "$file" | grep -q "^---"; then
                temp_file="/tmp/temp_$(basename "$file")"
                echo "---" > "$temp_file"
                echo "layout: default" >> "$temp_file"
                echo "---" >> "$temp_file"
                echo "" >> "$temp_file"
                cat "$file" >> "$temp_file"
                mv "$temp_file" "$file"
                echo "Added front matter to $(basename "$file")"
              fi
            fi
          done

      - name: Generate navigation from SUMMARY.md
        run: |
          cat > nav_generator.py << 'EOF'
          import re
          import os
          from pathlib import Path
          
          def parse_summary():
              """Parse SUMMARY.md to create navigation structure"""
              nav_items = []
              
              try:
                  with open('_site_source/SUMMARY.md', 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  # Parse markdown links: * [Title](path.md)
                  lines = content.split('\n')
                  for line in lines:
                      line = line.strip()
                      if not line or line.startswith('#'):
                          continue
                      
                      # Count indentation level
                      indent_level = 0
                      original_line = line
                      while line.startswith('  '):
                          indent_level += 1
                          line = line[2:]
                      
                      # Extract link
                      link_match = re.match(r'\* \[(.+?)\]\((.+?)\)', line)
                      if link_match:
                          title = link_match.group(1)
                          path = link_match.group(2)
                          
                          # Convert path to URL
                          if path == 'README.md':
                              url = '/'
                          else:
                              url = '/' + path.replace('.md', '').replace('README', '')
                              url = url.rstrip('/')
                              if url == '':
                                  url = '/'
                          
                          nav_items.append({
                              'title': title,
                              'url': url,
                              'path': path,
                              'level': indent_level
                          })
              
              except FileNotFoundError:
                  print("SUMMARY.md not found, using fallback navigation")
                  return []
              
              return nav_items
          
          # Parse SUMMARY.md
          nav_items = parse_summary()
          
          print('=== PARSED NAVIGATION FROM SUMMARY.MD ===')
          for item in nav_items:
              indent = '  ' * item['level']
              print(f'{indent}- {item["title"]}: {item["url"]} (level {item["level"]})')
          print('=== END PARSED NAVIGATION ===')
          
          # Generate HTML navigation
          nav_html = []
          
          for item in nav_items:
              if item['level'] == 0:
                  # Main section
                  nav_html.append(f'<li><a href="{item["url"]}">{item["title"]}</a></li>')
              elif item['level'] == 1:
                  # Subsection
                  nav_html.append(f'<li class="nav-subsection"><a href="{item["url"]}">{item["title"]}</a></li>')
              elif item['level'] == 2:
                  # Sub-subsection
                  nav_html.append(f'<li class="nav-sub-subsection"><a href="{item["url"]}">{item["title"]}</a></li>')
          
          # Save navigation to _includes directory for Jekyll
          mkdir -p _site_source/_includes
          with open('_site_source/_includes/navigation.html', 'w') as f:
              f.write('\n'.join(nav_html))
              
          print('=== GENERATED NAVIGATION HTML ===')
          print('\n'.join(nav_html))
          print('=== END NAVIGATION HTML ===')
          EOF
          
          python3 nav_generator.py

      - name: Create Jekyll config
        run: |
          cat > _site_source/_config.yml << 'EOF'
          title: "Admin Panel Documentation"
          description: "Administration Guide"
          baseurl: "/udoc"
          url: "https://amasyunin.github.io"
          
          markdown: kramdown
          kramdown:
            input: GFM
            syntax_highlighter: rouge
            hard_wrap: false
          
          highlighter: rouge
          
          plugins:
            - jekyll-sitemap
          
          defaults:
            - scope:
                path: ""
                type: "pages"
              values:
                layout: "default"
          
          include:
            - README.md
            - "*.md"
          
          exclude:
            - .gitbook*
            - book.json
            - node_modules/
            - "*.log"
            - Gemfile
            - Gemfile.lock
            - SUMMARY.md
            - nav_generator.py
          EOF

      - name: Create layout
        run: |
          mkdir -p _site_source/_layouts
          
          cat > _site_source/_layouts/default.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      line-height: 1.6;
                      color: #24292e;
                      background: #ffffff;
                      display: flex;
                      min-height: 100vh;
                  }
                  
                  .sidebar {
                      width: 280px;
                      background: #f6f8fa;
                      border-right: 1px solid #e1e4e8;
                      padding: 20px;
                      overflow-y: auto;
                      flex-shrink: 0;
                  }
                  
                  .sidebar h2 {
                      font-size: 16px;
                      margin-bottom: 20px;
                      color: #24292e;
                      border-bottom: 1px solid #e1e4e8;
                      padding-bottom: 8px;
                  }
                  
                  .sidebar ul {
                      list-style: none;
                  }
                  
                  .sidebar li {
                      margin-bottom: 6px;
                  }
                  
                  .sidebar a {
                      display: block;
                      padding: 8px 12px;
                      color: #586069;
                      text-decoration: none;
                      border-radius: 6px;
                      font-size: 14px;
                      transition: all 0.2s;
                  }
                  
                  .sidebar a:hover {
                      background-color: #e1e4e8;
                      color: #24292e;
                  }
                  
                  .sidebar .nav-section-header {
                      font-weight: 600;
                      color: #24292e;
                      padding: 12px 12px 8px 12px;
                      font-size: 13px;
                      text-transform: uppercase;
                      letter-spacing: 0.5px;
                      border-top: 1px solid #e1e4e8;
                      margin-top: 8px;
                  }
                  
                  .sidebar .nav-section-header:first-child {
                      border-top: none;
                      margin-top: 0;
                  }
                  
                  .sidebar .nav-subsection a {
                      padding-left: 24px;
                      font-size: 13px;
                      color: #6a737d;
                  }
                  
                  .sidebar .nav-subsection a:hover {
                      color: #24292e;
                  }
                  
                  .sidebar .nav-sub-subsection a {
                      padding-left: 36px;
                      font-size: 12px;
                      color: #8a8a8a;
                  }
                  
                  .sidebar .nav-sub-subsection a:hover {
                      color: #24292e;
                  }
                  
                  .content {
                      flex: 1;
                      padding: 40px;
                      overflow-y: auto;
                  }
                  
                  .content h1 {
                      font-size: 32px;
                      margin-bottom: 20px;
                      border-bottom: 1px solid #e1e4e8;
                      padding-bottom: 10px;
                  }
                  
                  .content h2 {
                      font-size: 24px;
                      margin-top: 32px;
                      margin-bottom: 16px;
                  }
                  
                  .content h3 {
                      font-size: 20px;
                      margin-top: 24px;
                      margin-bottom: 12px;
                  }
                  
                  .content p {
                      margin-bottom: 16px;
                  }
                  
                  .content ul, .content ol {
                      margin-bottom: 16px;
                      padding-left: 20px;
                  }
                  
                  .content li {
                      margin-bottom: 4px;
                  }
                  
                  .content code {
                      background: #f6f8fa;
                      padding: 2px 6px;
                      border-radius: 3px;
                      font-family: 'SFMono-Regular', Consolas, monospace;
                      font-size: 0.9em;
                  }
                  
                  .content pre {
                      background: #f6f8fa;
                      padding: 16px;
                      border-radius: 6px;
                      overflow-x: auto;
                      margin-bottom: 16px;
                      border: 1px solid #e1e4e8;
                  }
                  
                  .content pre code {
                      background: none;
                      padding: 0;
                  }
                  
                  .content blockquote {
                      border-left: 4px solid #0366d6;
                      background: #f6f8fa;
                      padding: 16px;
                      margin: 16px 0;
                      border-radius: 0 6px 6px 0;
                  }
                  
                  .content blockquote p {
                      margin-bottom: 8px;
                  }
                  
                  .content blockquote p:last-child {
                      margin-bottom: 0;
                  }
                  
                  .content table {
                      width: 100%;
                      border-collapse: collapse;
                      margin-bottom: 16px;
                  }
                  
                  .content th, .content td {
                      border: 1px solid #e1e4e8;
                      padding: 8px 12px;
                      text-align: left;
                  }
                  
                  .content th {
                      background: #f6f8fa;
                      font-weight: 600;
                  }
                  
                  .content img {
                      max-width: 100%;
                      height: auto;
                      margin: 16px 0;
                      border-radius: 6px;
                  }
                  
                  .content a {
                      color: #0366d6;
                      text-decoration: none;
                  }
                  
                  .content a:hover {
                      text-decoration: underline;
                  }
                  
                  @media (max-width: 768px) {
                      body {
                          flex-direction: column;
                      }
                      
                      .sidebar {
                          width: 100%;
                          border-right: none;
                          border-bottom: 1px solid #e1e4e8;
                      }
                      
                      .content {
                          padding: 20px;
                      }
                  }
              </style>
          </head>
          <body>
              <nav class="sidebar">
                  <h2>{{ site.title }}</h2>
                  <ul>
                      {% include navigation.html %}
                  </ul>
              </nav>
              
              <main class="content">
                  {{ content }}
              </main>
          </body>
          </html>
          HTMLEOF

      - name: Create Gemfile
        run: |
          cat > _site_source/Gemfile << 'EOF'
          source 'https://rubygems.org'
          
          gem 'jekyll', '~> 4.3.0'
          gem 'jekyll-sitemap'
          gem 'webrick'
          EOF

      - name: Build with Jekyll
        run: |
          cd _site_source
          
          echo "=== FILES BEFORE JEKYLL BUILD ==="
          find . -type f | sort
          echo "=== END FILES LISTING ==="
          
          echo "=== CHECKING CRITICAL FILES ==="
          if [ -f index.md ]; then
            echo "✓ index.md exists"
            echo "First few lines:"
            head -5 index.md
          else
            echo "✗ index.md MISSING!"
          fi
          
          if [ -f _config.yml ]; then
            echo "✓ _config.yml exists"
          else
            echo "✗ _config.yml MISSING!"
          fi
          
          if [ -f _layouts/default.html ]; then
            echo "✓ default.html layout exists"
          else
            echo "✗ default.html layout MISSING!"
          fi
          echo "=== END CRITICAL FILES CHECK ==="
          
          bundle install
          
          echo "=== RUNNING JEKYLL BUILD ==="
          bundle exec jekyll build --destination ../_site --verbose --trace
          echo "=== JEKYLL BUILD COMPLETE ==="
          
          echo "=== FILES AFTER JEKYLL BUILD ==="
          find ../_site -type f | sort
          echo "=== END BUILD OUTPUT ==="
          
          echo "=== CHECKING FOR INDEX.HTML ==="
          if [ -f ../_site/index.html ]; then
            echo "✓ index.html was created"
            echo "File size: $(wc -c < ../_site/index.html) bytes"
            echo "First few lines:"
            head -10 ../_site/index.html
          else
            echo "✗ index.html was NOT created!"
            echo "Available files in _site root:"
            ls -la ../_site/ || echo "No _site directory!"
          fi
          echo "=== END INDEX.HTML CHECK ==="

      - name: Create fallback if build fails
        run: |
          # If Jekyll failed to create index.html, create a simple fallback
          if [ ! -f _site/index.html ]; then
            echo "Jekyll build failed, creating fallback site"
            mkdir -p _site
            
            # Create a simple HTML file with navigation
            cat > _site/index.html << 'FALLBACKEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Admin Panel Documentation</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 40px; }
                  h1 { color: #24292e; border-bottom: 1px solid #e1e4e8; padding-bottom: 10px; }
                  .nav-list { list-style: none; padding: 0; }
                  .nav-list li { margin: 8px 0; }
                  .nav-list a { color: #0366d6; text-decoration: none; }
                  .nav-list a:hover { text-decoration: underline; }
                  .section-header { font-weight: bold; margin-top: 20px; color: #586069; }
              </style>
          </head>
          <body>
              <h1>Admin Panel Documentation</h1>
              <p>The Navixy Admin Panel is a powerful tool that allows administrators to customize the GPS tracking service platform.</p>
              
              <h2>Navigation</h2>
              <ul class="nav-list">
                  <li><a href="#overview">Overview</a></li>
                  <li><a href="#access">Access</a></li>
                  <li class="section-header">Devices</li>
                  <li><a href="#devices">Device Management</a></li>
                  <li><a href="#air-console">Air Console</a></li>
                  <li class="section-header">Plans</li>
                  <li><a href="#plans">Plan Management</a></li>
                  <li><a href="#activation">Activation Codes</a></li>
                  <li class="section-header">Settings</li>
                  <li><a href="#settings">Settings</a></li>
                  <li><a href="#branding">Branding Options</a></li>
                  <li class="section-header">Users</li>
                  <li><a href="#users">User Management</a></li>
              </ul>
              
              <p><em>Note: This is a simplified fallback. The full documentation should load once Jekyll builds successfully.</em></p>
          </body>
          </html>
          FALLBACKEOF
            
            echo "✓ Fallback index.html created"
          else
            echo "✓ Jekyll build succeeded, index.html exists"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
